<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>大成loklok 库存管理系统</title>
<style>
:root {
  --bg:#0f1115; --surface:#181b21; --surface-2:#22262f; --border:#2c313d;
  --text:#f3f4f6; --muted:#9ca3af; --blue:#2563eb; --blue-light:#3b82f6;
  --red-bg:rgba(239,68,68,.16); --red-text:#f87171; --green-text:#34d399;
}
body.light-mode {
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#e5e7eb; --border:#d1d5db;
  --text:#111827; --muted:#6b7280; --red-bg:#fee2e2; --red-text:#dc2626; --green-text:#059669;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding-top: calc(64px + env(safe-area-inset-top));
  padding-bottom: calc(132px + env(safe-area-inset-bottom));
  min-height: 100vh; transition: background .2s, color .2s;
}
header {
  position: fixed; top:0; left:0; right:0; z-index:40;
  height: calc(64px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.shop-title { font-size:19px; font-weight:800; }
.shop-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.theme-btn {
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:18px;
}
main { max-width:600px; margin:0 auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
#floatingBar {
  position:fixed; left:0; right:0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index:35;
  background: var(--bg); border-top:1px solid var(--border); padding:8px 14px;
}
.float-inner { max-width:600px; margin:0 auto; display:flex; gap:8px; align-items:center; }
nav {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  height: calc(62px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top:1px solid var(--border);
  display:grid; grid-template-columns: repeat(4, 1fr);
}
.nav-item {
  background:none; border:none; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:11px; font-weight:600; cursor:pointer;
}
.nav-item svg { width:21px; height:21px; }
.nav-item.active { color: var(--blue-light); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
.card-hd { font-size:15px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
input, select, textarea {
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:14px; outline:none;
}
input:focus, textarea:focus { border-color: var(--blue-light); }
.btn {
  border:none; border-radius:10px; padding:11px 14px; font-size:14px; font-weight:700;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active { transform: scale(.98); }
.btn-blue { background: var(--blue); color:#fff; }
.btn-dark { background: var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
.btn-full { width:100%; }
.pills-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.pills-row::-webkit-scrollbar { display:none; }
.pill {
  white-space:nowrap; padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600;
  background:var(--surface-2); color:var(--text); border:1px solid var(--border); cursor:pointer;
}
.pill.active { background: var(--blue); color:#fff; border-color: var(--blue); }
.cat-header {
  background:var(--surface-2); padding:11px 14px; border-radius:12px;
  display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; cursor:pointer;
}
.p-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; }
.p-top { display:flex; gap:12px; align-items:center; }
.p-thumb {
  width:64px; height:64px; border-radius:10px; object-fit:cover;
  background:var(--surface-2); border:1px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--muted); overflow:hidden;
}
.p-thumb img { width:100%; height:100%; object-fit:cover; }
.low-tag { background: var(--red-bg); color: var(--red-text); font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:6px; }
.rem-row { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
.rem-input {
  width:105px; height:44px; text-align:center; font-size:18px; font-weight:800;
  border:2px solid var(--blue); background:var(--bg); border-radius:10px;
}
.quick-btns { display:flex; gap:8px; }
.q-btn {
  padding:6px 14px; border-radius:18px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); font-size:13px; font-weight:700; cursor:pointer;
}
.q-btn:active { background:var(--blue); color:#fff; }
.ws-box { border-top:1px solid var(--border); padding-top:10px; }
.ws-grid { display:grid; grid-template-columns:95px 1fr; gap:8px; margin-top:6px; }
.prog-track { height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; margin-top:8px; }
.prog-fill { height:100%; background:var(--blue-light); transition:width .25s; }
.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:14px;
}
.modal-card {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  width:100%; max-width:460px; max-height:90vh; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
}
.cat-chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  padding:7px 13px; border-radius:18px; font-size:13px; font-weight:600;
  background:var(--surface-2); color:var(--text); border:1px solid var(--border); cursor:pointer;
}
.chip.selected { background:var(--blue); color:#fff; border-color:var(--blue); }
.toast {
  position:fixed; top:76px; left:50%; transform:translateX(-50%); z-index:99;
  background:#1f2937; color:#fff; border:1px solid var(--blue-light);
  padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show { opacity:1; }
.info-quote { background:var(--surface-2); border-left:3px solid var(--blue-light); padding:10px 12px; border-radius:8px; font-size:13px; line-height:1.6; }
</style>
</head>
<body>

<header>
  <div>
    <div class="shop-title" id="hdrShopName">大成loklok</div>
    <div class="shop-sub" id="hdrSub">最后盘点 -- · 0 个产品</div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="切换主题">☀️</button>
</header>

<main id="mainApp"></main>

<div id="floatingBar">
  <div class="float-inner">
    <button class="btn btn-blue" style="flex:1" onclick="fillSameAsYesterday()">和昨天一样</button>
    <button class="btn btn-dark" onclick="toggleCollapseAll()" title="全部展开/收起">⊞</button>
    <button class="btn btn-blue" style="flex:1.4" id="btnSendWa" onclick="openWaModal()">发送至 WhatsApp (0/0)</button>
  </div>
</div>

<nav>
  <button class="nav-item active" data-tab="count" onclick="switchTab('count')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>盘点</span>
  </button>
  <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V11"/><path d="M11 21V5"/><path d="M16 21v-7"/></svg>
    <span>统计</span>
  </button>
  <button class="nav-item" data-tab="products" onclick="switchTab('products')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4v10l8 4 8-4z"/><path d="M4 7l8 4 8-4"/><path d="M12 21V11"/></svg>
    <span>产品</span>
  </button>
  <button class="nav-item" data-tab="settings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.4.65.74.85.34.2.73.3 1.12.3H21a2 2 0 1 1 0 4h-.09c-.39 0-.78.1-1.12.3-.34.2-.6.5-.74.85z"/></svg>
    <span>设定</span>
  </button>
</nav>

<div id="toast" class="toast"></div>
<div id="modalLayer"></div>

<script>
var DEFAULT_CATEGORIES = ['蔬菜和菇','豆类','培根类','鸡肉类','鸭肉类','猪肉类','蛋类','海鲜类','丸类','香肠类','肉片类','馒头类','其他类','酱料类'];

var PRESET_PRODUCTS = [
  { id:'pr_1',  name:'KING OYSTER 杏鲍菇', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🍄' },
  { id:'pr_2',  name:'BUNA SHIMEIJI 灵芝菇', price:0.55, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🍄' },
  { id:'pr_3',  name:'SHITAKE 花菇', price:0.60, cat:'蔬菜和菇', spec:'1 stick2', unit:'支', low:20, emoji:'🍄' },
  { id:'pr_4',  name:'JAGUNG 玉蜀黍（大）', price:0.60, cat:'蔬菜和菇', spec:'10 Sticks/bag', unit:'支', low:20, emoji:'🌽' },
  { id:'pr_5',  name:'WHITE BUTTON MUSHROOM 白蘑菇', price:0.55, cat:'蔬菜和菇', spec:'20 Sticks/bag', unit:'支', low:20, emoji:'🍄' },
  { id:'pr_6',  name:'KACANG PANJANG 长豆', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🥬' },
  { id:'pr_7',  name:'BENDI 羊角豆', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🥬' },
  { id:'pr_8',  name:'BABY BRINJAL 茄子', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🍆' },
  { id:'pr_9',  name:'ABALONE MUSHROOM 鲍鱼菇', price:0.55, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🍄' },
  { id:'pr_10', name:'BROCCOLI 西兰花', price:0.60, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🥦' },
  { id:'pr_11', name:'TAU POK 豆卜', price:0.50, cat:'豆类', spec:'1 stick', unit:'支', low:20, emoji:'🟨' },
  { id:'pr_12', name:'FU CHUK 炸腐竹', price:0.60, cat:'豆类', spec:'1 stick', unit:'支', low:20, emoji:'🥟' },
  { id:'pr_13', name:'BACON ENOKI 培根金针菇', price:1.20, cat:'培根类', spec:'1 stick', unit:'支', low:15, emoji:'🥓' },
  { id:'pr_14', name:'SMOKED DUCK 烟熏鸭胸', price:1.20, cat:'鸭肉类', spec:'1 stick', unit:'支', low:15, emoji:'🦆' },
  { id:'pr_15', name:'CHICKEN MID WING 鸡中翅', price:1.50, cat:'鸡肉类', spec:'1 stick', unit:'支', low:15, emoji:'🍗' },
  { id:'pr_16', name:'PORK BELLY 五花肉片', price:1.20, cat:'猪肉类', spec:'1 stick', unit:'支', low:15, emoji:'🥩' },
  { id:'pr_17', name:'QUAIL EGG 鹌鹑蛋', price:0.80, cat:'蛋类', spec:'1 stick3', unit:'支', low:15, emoji:'🥚' },
  { id:'pr_18', name:'PRAWN 鲜虾串', price:1.50, cat:'海鲜类', spec:'1 stick', unit:'支', low:15, emoji:'🦐' },
  { id:'pr_19', name:'75 MEATBALL 肉丸', price:0.60, cat:'丸类', spec:'1 stick3', unit:'支', low:20, emoji:'🍡' },
  { id:'pr_20', name:'CHEESE TOFU 芝士豆腐', price:0.70, cat:'丸类', spec:'1 stick2', unit:'支', low:20, emoji:'🧀' },
  { id:'pr_21', name:'TAIWAN SAUSAGE 台湾香肠', price:1.20, cat:'香肠类', spec:'1 stick', unit:'支', low:15, emoji:'🌭' },
  { id:'pr_22', name:'MANTOU 黄金小馒头', price:0.60, cat:'馒头类', spec:'1 stick*2', unit:'支', low:15, emoji:'🥯' }
];

var K_PRODS = 'dc_v2_products';
var K_RECS  = 'dc_v2_records';
var K_CFG   = 'dc_v2_settings';

var appState = {
  tab: 'count',
  date: getLocalDate(0),
  selectedCat: 'ALL',
  search: '',
  collapsedCats: {},
  statsDays: 7,
  statsView: 'chart',
  products: JSON.parse(localStorage.getItem(K_PRODS) || '[]'),
  records: JSON.parse(localStorage.getItem(K_RECS) || '{}'),
  settings: JSON.parse(localStorage.getItem(K_CFG) || JSON.stringify({
    shopName: '大成loklok',
    defaultLow: 5,
    whatsapp: '',
    categories: DEFAULT_CATEGORIES.slice()
  }))
};
if (!appState.settings.categories) appState.settings.categories = DEFAULT_CATEGORIES.slice();

function getLocalDate(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().split('T')[0];
}
function formatCnDate(dateStr) {
  if (!dateStr) return '--';
  var parts = dateStr.split('-');
  return Number(parts[1]) + '月' + Number(parts[2]) + '日';
}
function formatCnDateWeek(dateStr) {
  var weeks = ['周日','周一','周二','周三','周四','周五','周六'];
  var dt = new Date(dateStr + 'T00:00:00');
  return formatCnDate(dateStr) + weeks[dt.getDay()];
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function saveStore() {
  localStorage.setItem(K_PRODS, JSON.stringify(appState.products));
  localStorage.setItem(K_RECS, JSON.stringify(appState.records));
  localStorage.setItem(K_CFG, JSON.stringify(appState.settings));
}
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function toggleTheme() { document.body.classList.toggle('light-mode'); }

function getLastRecordBefore(prodId, dateStr) {
  var prevDates = Object.keys(appState.records).filter(function(d){ return d < dateStr; }).sort().reverse();
  for (var i = 0; i < prevDates.length; i++) {
    var d = prevDates[i];
    var r = appState.records[d] && appState.records[d][prodId];
    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      return { date: d, rem: Number(r.rem) };
    }
  }
  return null;
}
function getLatestRem(prodId) {
  var allDates = Object.keys(appState.records).sort().reverse();
  for (var i = 0; i < allDates.length; i++) {
    var d = allDates[i];
    var r = appState.records[d] && appState.records[d][prodId];
    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      return Number(r.rem);
    }
  }
  return null;
}
function isDateEditable(dateStr) {
  var minEditable = getLocalDate(-2);
  return dateStr >= minEditable;
}
function calcDayStats(dateStr) {
  var dayMap = appState.records[dateStr] || {};
  var filled = 0, soldCount = 0, restockCount = 0, wasteCount = 0, wasteAmt = 0, salesAmt = 0;
  appState.products.forEach(function(p) {
    var r = dayMap[p.id];
    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      filled++;
      var curRem = Number(r.rem);
      var prev = getLastRecordBefore(p.id, dateStr);
      if (prev) {
        var diff = prev.rem - curRem;
        if (diff > 0) { soldCount += diff; salesAmt += diff * p.price; }
        else if (diff < 0) { restockCount += Math.abs(diff); }
      }
    }
    if (r && Number(r.waste) > 0) {
      var w = Number(r.waste);
      wasteCount += w;
      wasteAmt += w * p.price;
    }
  });
  return { filled:filled, total: appState.products.length, soldCount:soldCount, restockCount:restockCount, wasteCount:wasteCount, wasteAmt:wasteAmt, salesAmt:salesAmt };
}

function render() {
  var recordedDates = Object.keys(appState.records).sort().reverse();
  var lastDate = recordedDates.length ? formatCnDate(recordedDates[0]) : '暂无';
  var hdr1 = document.getElementById('hdrShopName');
  var hdr2 = document.getElementById('hdrSub');
  if (hdr1) hdr1.textContent = appState.settings.shopName || '大成loklok';
  if (hdr2) hdr2.textContent = '最后盘点 ' + lastDate + ' · ' + appState.products.length + ' 个产品';

  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab === appState.tab);
  });

  var floatBar = document.getElementById('floatingBar');
  if (floatBar) floatBar.style.display = (appState.tab === 'count') ? 'block' : 'none';

  var main = document.getElementById('mainApp');
  if (!main) return;
  if (appState.tab === 'count') main.innerHTML = viewCount();
  else if (appState.tab === 'stats') main.innerHTML = viewStats();
  else if (appState.tab === 'products') main.innerHTML = viewProducts();
  else if (appState.tab === 'settings') main.innerHTML = viewSettings();
}

function viewCount() {
  var stats = calcDayStats(appState.date);
  var editable = isDateEditable(appState.date);
  var pct = stats.total ? Math.round((stats.filled / stats.total) * 100) : 0;

  var btn = document.getElementById('btnSendWa');
  if (btn) btn.textContent = '发送至 WhatsApp (' + stats.filled + '/' + stats.total + ')';

  var cats = appState.settings.categories || DEFAULT_CATEGORIES;
  var filtered = appState.products.filter(function(p){
    var matchCat = appState.selectedCat === 'ALL' || p.cat === appState.selectedCat;
    var matchKw = p.name.toLowerCase().indexOf(appState.search.toLowerCase()) > -1;
    return matchCat && matchKw;
  });
  var groups = {};
  filtered.forEach(function(p){
    if (!groups[p.cat]) groups[p.cat] = [];
    groups[p.cat].push(p);
  });
  var allExpanded = cats.every(function(c){ return !appState.collapsedCats[c]; });

  var html = '';
  if (!editable) {
    html += '<div class="info-quote" style="border-left-color:#f59e0b;">🔒 历史日期只读模式（仅支持修改今天、昨天、前天）</div>';
  }

  html += '<div class="card">' +
    '<div class="card-hd"><span>盘点日期</span><span style="font-size:12px;color:var(--muted);">已填 ' + stats.filled + ' / ' + stats.total + '</span></div>' +
    '<input type="date" value="' + appState.date + '" onchange="changeDate(this.value)">' +
    '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';

  html += '<div style="display:flex;gap:8px;align-items:center;">' +
    '<button class="btn btn-dark btn-sm" onclick="toggleCollapseAll()">' + (allExpanded ? '全部收起' : '全部展开') + '</button>' +
    '<input type="text" placeholder="🔍 搜索产品…" value="' + esc(appState.search) + '" oninput="setSearch(this.value)" style="flex:1;">' +
    '</div>';

  html += '<div class="pills-row">' +
    '<button class="pill ' + (appState.selectedCat === 'ALL' ? 'active' : '') + '" onclick="selectCat(\'ALL\')">全部</button>';
  cats.forEach(function(c){
    html += '<button class="pill ' + (appState.selectedCat === c ? 'active' : '') + '" onclick="selectCat(\'' + esc(c) + '\')">' + esc(c) + '</button>';
  });
  html += '</div>';

  if (appState.products.length === 0) {
    html += '<div class="card" style="text-align:center;padding:24px;">' +
      '<div style="font-size:36px;margin-bottom:8px;">📦</div>' +
      '<div style="font-weight:700;margin-bottom:6px;">还没有任何产品</div>' +
      '<div style="color:var(--muted);font-size:13px;margin-bottom:14px;">你可以一键载入完整分类清单，或自行新增产品。</div>' +
      '<button class="btn btn-blue btn-full" onclick="loadPresetList()">✨ 载入全部预设产品清单</button>' +
      '</div>';
  }

  Object.keys(groups).forEach(function(cat){
    var items = groups[cat];
    var doneInCat = items.filter(function(p){
      var r = appState.records[appState.date] && appState.records[appState.date][p.id];
      return r && r.rem !== '' && r.rem !== undefined;
    }).length;
    var isCollapsed = !!appState.collapsedCats[cat];
    html += '<div class="cat-header" onclick="toggleCat(\'' + esc(cat) + '\')">' +
      '<div>' + (isCollapsed ? '▸' : '▾') + ' &nbsp;' + esc(cat) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);font-weight:600;">' + doneInCat + ' / ' + items.length + '</div>' +
      '</div>';
    if (!isCollapsed) {
      items.forEach(function(p){ html += renderCountCard(p, editable); });
    }
  });

  return html;
}

function renderCountCard(p, editable) {

    ? '<img src="' + p.img + '" alt="">'

  var lowHtml = isLow ? '<span class="low-tag">库存偏低</span>' : '';

      '</div>' +
    '</div>' +

      '<span style="font-size:13px;color:var(--muted);">剩余数量:</span>' +
      '<input type="number" min="0" class="rem-input" ' + disAttr + ' value="' + (hasRem ? rec.rem : '') + '" placeholder="-" onchange="updateRec(\'' + p.id + '\',\'rem\',this.value)">' +
      '<span style="font-size:13px;color:var(--muted);">' + esc(p.unit) + '</span>' +

function viewStats() {
  var dates = [];
  for (var i = appState.statsDays - 1; i >= 0; i--) dates.push(getLocalDate(-i));
  var activeDays = dates.filter(function(d){ return appState.records[d] && Object.keys(appState.records[d]).length > 0; });
  var countedProdSet = {};
  activeDays.forEach(function(d){
    Object.keys(appState.records[d]).forEach(function(pid){ countedProdSet[pid] = true; });
  });
  var countedCount = Object.keys(countedProdSet).length;

  var dayBtns = '';
  var dayOpts = [1, 2, 7, 30];
  var labels = ['今天', '昨天', '7 天', '30 天'];
  for (var k = 0; k < dayOpts.length; k++) {
    var dv = dayOpts[k];
    dayBtns += '<button class="pill ' + (appState.statsDays === dv ? 'active' : '') + '" onclick="setStatsDays(' + dv + ')">' + labels[k] + '</button>';
  }

  var chartRows = '';
  appState.products.forEach(function(p){
    var pts = [];
    dates.forEach(function(d){
      var r = appState.records[d] && appState.records[d][p.id];
      if (r && r.rem !== '' && r.rem !== undefined) pts.push(Number(r.rem));
    });
    if (!pts.length) return;
    var latest = pts[pts.length - 1];
    var minV = Math.min.apply(null, pts);
    var maxV = Math.max.apply(null, pts);
    var bodyHtml = appState.statsView === 'chart'
      ? renderSparkline(pts, minV, maxV, dates[0], dates[dates.length - 1])
      : '<div style="font-size:12px;color:var(--muted);">区间记录：' + pts.join(' → ') + ' ' + esc(p.unit) + '</div>';
    chartRows += '<div class="p-card" style="padding:12px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<div style="font-weight:700;font-size:14px;">' + esc(p.name) + '</div>' +
        '<div style="font-weight:800;font-size:16px;">' + latest + ' <span style="font-size:11px;color:var(--muted);">' + esc(p.unit) + '</span></div>' +
      '</div>' +
      bodyHtml +
    '</div>';
  });
  if (!chartRows) chartRows = '<div class="info-quote">所选时间段内暂无盘点走势数据</div>';

  return '<div class="pills-row">' + dayBtns + '</div>' +
    '<div class="info-quote">' + dates[0] + ' — ' + dates[dates.length - 1] + ' · 其中 ' + activeDays.length + ' 天有盘点</div>' +
    '<div style="display:flex;gap:8px;">' +
      '<div class="card" style="flex:1;text-align:center;padding:12px;">' +
        '<div style="font-size:12px;color:var(--muted);">有盘点的产品</div>' +
        '<div style="font-size:24px;font-weight:800;">' + countedCount + '</div>' +
      '</div>' +
      '<div class="card" style="flex:1;text-align:center;padding:12px;">' +
        '<div style="font-size:12px;color:var(--muted);">盘点天数</div>' +
        '<div style="font-size:24px;font-weight:800;">' + activeDays.length + '<span style="font-size:12px;color:var(--muted);"> / ' + appState.statsDays + '天</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="card-hd"><span>剩余数量走势</span><span style="font-size:12px;color:var(--muted);">' + countedCount + ' 个产品</span></div>' +
    '<button class="btn btn-dark btn-full btn-sm" onclick="toggleStatsView()">' + (appState.statsView === 'chart' ? '切换表格' : '切换走势图') + '</button>' +
    chartRows;
}

function renderSparkline(pts, minV, maxV, startD, endD) {
  var w = 110, h = 44;
  var span = Math.max(1, maxV - minV);
  var coords = pts.map(function(v, i){
    var x = pts.length === 1 ? w / 2 : (i / (pts.length - 1)) * (w - 12) + 6;
    var y = h - 8 - ((v - minV) / span) * (h - 16);
    return x + ',' + y;
  });
  var lastPt = coords[coords.length - 1].split(',');
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;">' +
    '<div style="font-size:10px;color:var(--muted);">' + formatCnDate(startD) + '</div>' +
    '<div style="font-size:10px;color:var(--muted);text-align:center;">最低 ' + minV + ' · 最高 ' + maxV + '</div>' +
    '<div><svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="overflow:visible;">' +
      '<polyline points="' + coords.join(' ') + '" fill="none" stroke="var(--blue-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + lastPt[0] + '" cy="' + lastPt[1] + '" r="3" fill="var(--blue-light)"/>' +
    '</svg></div>' +
    '<div style="font-size:10px;color:var(--muted);">' + formatCnDate(endD) + '</div>' +
  '</div>';
}

function setSearch(q) { appState.search = q; render(); }
function selectCat(c) { appState.selectedCat = c; render(); }
function toggleCat(c) { appState.collapsedCats[c] = !appState.collapsedCats[c]; render(); }
function setStatsDays(d) { appState.statsDays = d; render(); }
function toggleStatsView() { appState.statsView = appState.statsView === 'chart' ? 'table' : 'chart'; render(); }
function openHistoryDate(d) { appState.date = d; appState.tab = 'count'; render(); }
function toggleCollapseAll() {
  var cats = appState.settings.categories || DEFAULT_CATEGORIES;
  var anyOpen = cats.some(function(c){ return !appState.collapsedCats[c]; });
  cats.forEach(function(c){ appState.collapsedCats[c] = anyOpen; });
  render();
}
function updateRec(pid, field, val) {
  if (!isDateEditable(appState.date)) return toast('超过3天的历史记录不可修改');
  if (!appState.records[appState.date]) appState.records[appState.date] = {};
  if (!appState.records[appState.date][pid]) appState.records[appState.date][pid] = { rem:'', waste:0, wasteReason:'' };
  if (field === 'rem') appState.records[appState.date][pid].rem = (val === '' ? '' : Number(val));
  else if (field === 'waste') appState.records[appState.date][pid].waste = (val === '' ? 0 : Number(val));
  else appState.records[appState.date][pid].wasteReason = val;
  saveStore();
  render();
}
function quickSetRem(pid, num) { updateRec(pid, 'rem', num); }
function fillSameAsYesterday() {
  if (!isDateEditable(appState.date)) return toast('只读日期无法修改');
  if (!appState.records[appState.date]) appState.records[appState.date] = {};
  var cnt = 0;
  appState.products.forEach(function(p){
    var cur = appState.records[appState.date][p.id];
    if (!cur || cur.rem === '' || cur.rem === undefined || cur.rem === null) {
      var prev = getLastRecordBefore(p.id, appState.date);
      if (prev) {
        appState.records[appState.date][p.id] = {
          rem: prev.rem,
          waste: cur ? cur.waste : 0,
          wasteReason: cur ? cur.wasteReason : ''
        };
        cnt++;
      }
    }
  });
  saveStore();
  render();
  toast('已自动补齐 ' + cnt + ' 个未动产品');
}
function saveSettingsNow() {
  appState.settings.shopName = document.getElementById('setShop').value.trim() || '大成loklok';
  appState.settings.defaultLow = Number(document.getElementById('setLow').value) || 5;
  appState.settings.whatsapp = document.getElementById('setWa').value.replace(/\D/g, '');
  saveStore();
  render();
  toast('设定已保存');
}

        '<div><div style="font-size:12px;color:var(--muted);margin-bottom:4px;">低库存提醒值</div>' +
          '<input id="edLow" type="number" value="' + (p.low || 5) + '"></div>' +
        '<div style="display:flex;gap:8px;">' + delBtnHtml +
          '<button class="btn btn-blue btn-full" onclick="saveProdEditor(' + (pid ? '\'' + pid + '\'' : 'null') + ')">保存产品</button></div>' +
      '</div>' +
    '</div>';
}
function pickModalCat(btn, cat) {
  editingProdCat = cat;
  document.querySelectorAll('#catChipsBox .chip').forEach(function(el){ el.classList.remove('selected'); });
  btn.classList.add('selected');
}
function addNewCategory(pid) {
  var name = prompt('请输入新分类名称：');
  if (!name || !name.trim()) return;
  var clean = name.trim();
  if (appState.settings.categories.indexOf(clean) === -1) {
    appState.settings.categories.push(clean);
    saveStore();
  }
  editingProdCat = clean;
  openProdEditor(pid || null);
}
function handlePhotoUpload(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 180;
      var scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      editingProdImg = canvas.toDataURL('image/jpeg', 0.72);
      document.getElementById('imgPreviewBox').innerHTML = '<img src="' + editingProdImg + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function saveProdEditor(pid) {
  var name = document.getElementById('edName').value.trim();
  var price = parseFloat(document.getElementById('edPrice').value) || 0;
  var spec = document.getElementById('edSpec').value.trim() || '1 stick';
  var unit = document.getElementById('edUnit').value.trim() || '支';
  var low = parseInt(document.getElementById('edLow').value) || 5;
  if (!name) return toast('请输入产品名称');
  if (pid) {
    for (var i = 0; i < appState.products.length; i++) {
      if (appState.products[i].id === pid) {
        appState.products[i].name = name;
        appState.products[i].price = price;
        appState.products[i].cat = editingProdCat;
        appState.products[i].spec = spec;
        appState.products[i].unit = unit;
        appState.products[i].low = low;
        appState.products[i].img = editingProdImg;
        break;
      }
    }
  } else {
    appState.products.push({
      id:'p_' + Date.now(), name:name, price:price, cat:editingProdCat,
      spec:spec, unit:unit, low:low, img:editingProdImg, emoji:'🍢'
    });
  }
  saveStore();
  closeModal();
  render();
  toast('产品已保存');
}
function deleteProd(pid) {
  if (!confirm('确定删除此产品？')) return;
  appState.products = appState.products.filter(function(x){ return x.id !== pid; });
  saveStore();
  closeModal();
  render();
  toast('已删除');
}
function openBatchAddModal() {
  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-weight:800;font-size:17px;">⚡ 批量粘贴自动添加</div>' +
          '<button class="btn btn-dark btn-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="info-quote">每行一个产品，格式：产品名, 单价, 分类（不写单价和分类会自动用默认值）</div>' +
        '<textarea id="batchInput" rows="8" placeholder="鱼饼 FISH CAKE, 0.60, 丸类&#10;鸡肉串 CHICKEN SKEWER, 1.20, 鸡肉类"></textarea>' +
        '<button class="btn btn-blue btn-full" onclick="processBatchAdd()">一键全部加入产品库</button>' +
      '</div>' +
    '</div>';
}
function processBatchAdd() {
  var lines = document.getElementById('batchInput').value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if (!lines.length) return toast('请先粘贴产品内容');
  var added = 0;
  lines.forEach(function(line, idx){
    var parts = line.split(/[,，\t]/).map(function(s){ return s.trim(); });
    var name = parts[0];
    if (!name) return;
    if (appState.products.some(function(p){ return p.name === name; })) return;
    var price = parseFloat(parts[1]) || 0.50;
    var cat = parts[2] || appState.settings.categories[0] || '其他类';
    if (appState.settings.categories.indexOf(cat) === -1) appState.settings.categories.push(cat);
    appState.products.push({
      id:'p_' + Date.now() + '_' + idx,
      name:name, price:price, cat:cat, spec:'1 stick', unit:'支',
      low: appState.settings.defaultLow, emoji:'🍢'
    });
    added++;
  });
  saveStore();
  closeModal();
  render();
  toast('成功批量添加 ' + added + ' 个产品！');
}
function openWaModal() {
  var s = calcDayStats(appState.date);
  var lowList = [], wasteList = [], remLines = [];
  appState.products.forEach(function(p){
    var r = appState.records[appState.date] && appState.records[appState.date][p.id];
    if (r && r.rem !== '' && r.rem !== undefined) {
      remLines.push('• ' + p.name + ': ' + r.rem + p.unit);
      if (Number(r.rem) <= p.low) lowList.push('• ' + p.name + ': 剩 ' + r.rem + p.unit + ' (警戒≤' + p.low + ')');
    }
    if (r && Number(r.waste) > 0) {
      wasteList.push('• ' + p.name + ': ' + r.waste + p.unit + ' (RM ' + (Number(r.waste) * p.price).toFixed(2) + ') ' + (r.wasteReason ? '[' + r.wasteReason + ']' : ''));
    }
  });
  var text = '📋【' + appState.settings.shopName + '】盘点报告\n' +
    '📅 日期：' + appState.date + ' (' + formatCnDateWeek(appState.date) + ')\n' +
    '✅ 进度：已盘点 ' + s.filled + ' / ' + s.total + ' 项\n' +
    '━━━━━━━━━━━━━━━━━━\n' +
    '📉 较上次减少（卖出）：' + s.soldCount + ' 支 (约 RM ' + s.salesAmt.toFixed(2) + ')\n' +
    '📈 较上次增加（进货）：' + s.restockCount + ' 支\n' +
    '🗑️ 今日损耗 WS：' + s.wasteCount + ' 支 (RM ' + s.wasteAmt.toFixed(2) + ')\n' +
    '━━━━━━━━━━━━━━━━━━\n' +
    '🚨 低库存提醒 (' + lowList.length + ')：\n' + (lowList.length ? lowList.join('\n') : '无') + '\n\n' +
    '⚠️ 损耗明细：\n' + (wasteList.length ? wasteList.join('\n') : '无') + '\n\n' +
    '📦 已盘点剩余明细：\n' + (remLines.length ? remLines.join('\n') : '暂未填写');
  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-weight:800;font-size:17px;">WhatsApp 盘点报告预览</div>' +
          '<button class="btn btn-dark btn-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<textarea id="waFinalText" rows="14" style="font-family:monospace;font-size:12px;">' + esc(text) + '</textarea>' +
        '<div style="display:flex;gap:8px;">' +
          '<button class="btn btn-dark btn-full" onclick="copyReportText()">复制文字</button>' +
          '<button class="btn btn-blue btn-full" onclick="launchWhatsApp()">打开 WhatsApp</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
function copyReportText() {
  var el = document.getElementById('waFinalText');
  el.select();
  navigator.clipboard.writeText(el.value);
  toast('报告已复制到剪贴板');
}
function launchWhatsApp() {
  var msg = encodeURIComponent(document.getElementById('waFinalText').value);
  var phone = appState.settings.whatsapp;
  window.open(phone ? ('https://wa.me/' + phone + '?text=' + msg) : ('https://wa.me/?text=' + msg), '_blank');
}
function closeModal() { document.getElementById('modalLayer').innerHTML = ''; }

function loadPresetList() {
  var added = 0;
  PRESET_PRODUCTS.forEach(function(item){
    if (!appState.products.some(function(p){ return p.name === item.name; })) {
      appState.products.push({
        id:'p_' + Date.now() + '_' + added,
        name:item.name, price:item.price, cat:item.cat, spec:item.spec, unit:item.unit, low:item.low, emoji:item.emoji
      });
      added++;
    }
  });
  saveStore();
  render();
  toast(added ? ('已载入 ' + added + ' 项预设产品') : '预设产品已全部存在');
}
function fillDemoRecords() {
  if (!appState.products.length) loadPresetList();
  var yest = getLocalDate(-1);
  var today = getLocalDate(0);
  if (!appState.records[yest]) appState.records[yest] = {};
  if (!appState.records[today]) appState.records[today] = {};
  appState.products.forEach(function(p, i){
    var base = 15 + (i % 4) * 10;
    appState.records[yest][p.id] = { rem:base, waste:0, wasteReason:'' };
    appState.records[today][p.id] = {
      rem: Math.max(0, base - (i % 7)),
      waste: (i % 5 === 0 ? 1 : 0),
      wasteReason: (i % 5 === 0 ? '掉落' : '')
    };
  });
  saveStore();
  render();
  toast('已填入昨日与今日示范盘点资料');
}
function exportExcelCsv() {
  if (!appState.products.length) return toast('暂无产品资料');
  var header = ['日期,分类,产品名称,规格,单价(RM),上次剩余,今日剩余,损耗个数,损耗金额(RM),损耗原因'];
  var lines = appState.products.map(function(p){
    var r = (appState.records[appState.date] && appState.records[appState.date][p.id]) || {};
    var prev = getLastRecordBefore(p.id, appState.date);
    var prevRem = prev ? prev.rem : '';
    var rem = (r.rem !== '' && r.rem !== undefined) ? r.rem : '';
    var waste = r.waste || 0;
    var wasteAmt = (waste * p.price).toFixed(2);
    return appState.date + ',"' + p.cat + '","' + p.name + '","' + p.spec + '",' + p.price + ',' + prevRem + ',' + rem + ',' + waste + ',' + wasteAmt + ',"' + (r.wasteReason || '') + '"';
  });
  var blob = new Blob(['\uFEFF' + header.concat(lines).join('\n')], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = appState.settings.shopName + '盘点报表' + appState.date + '.csv';
  a.click();
  toast('报表已导出（可用 Excel 打开）');
}
function exportJsonBackup() {
  var blob = new Blob([JSON.stringify({ products:appState.products, records:appState.records, settings:appState.settings }, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '大成loklok备份_' + getLocalDate(0) + '.json';
  a.click();
}
function importJsonBackup(e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var d = JSON.parse(ev.target.result);
      if (d.products) appState.products = d.products;
      if (d.records) appState.records = d.records;
      if (d.settings) appState.settings = d.settings;
      if (!appState.settings.categories) appState.settings.categories = DEFAULT_CATEGORIES.slice();
      saveStore();
      render();
      toast('备份还原成功');
    } catch (err) { toast('备份文件格式错误'); }
  };
  reader.readAsText(f);
}
function clearEverything() {
  if (!confirm('⚠️ 确定要清空全部资料吗？')) return;
  appState.products = [];
  appState.records = {};
  saveStore();
  render();
  toast('已清空全部资料');
}

render();
</script>
</body>
