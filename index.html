<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>大成loklok 库存管理系统</title>
  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #121212;
  --surface: #1e1e1e;
  --surface-2: #2c2c2e;
  --border: #38383a;
  --text: #ffffff;
  --muted: #8e8e93;
  --blue: #0a84ff;
  --blue-light: #409cff;
  --red: #ff453a;
  --red-bg: rgba(255, 69, 58, 0.15);
  --green: #32d74b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding-top: calc(60px + env(safe-area-inset-top));
  padding-bottom: calc(130px + env(safe-area-inset-bottom));
  min-height: 100vh; transition: background .2s;
}
header {
  position: fixed; top:0; left:0; right:0; z-index:40;
  height: calc(60px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0;
  background: var(--bg); display:flex; align-items:center; justify-content:space-between;
}
.shop-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.shop-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.theme-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
main { max-width: 600px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
#floatingBar {
  position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 35;
  background: var(--bg); padding: 10px 16px; display: flex; gap: 10px;
}
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav-item {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 10px; font-weight: 600; cursor: pointer;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--blue); }
.card { background: var(--surface); border-radius: 12px; padding: 16px; }
input, select, textarea {
  width: 100%; background: var(--surface-2); border: 1px solid transparent; color: var(--text);
  border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; transition: border .2s;
}
input:focus, textarea:focus { border-color: var(--blue); }
.btn {
  border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { opacity: 0.8; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-dark { background: var(--surface-2); color: var(--text); }
.btn-full { width: 100%; }
.pills-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.pills-row::-webkit-scrollbar { display: none; }
.pill {
  white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
  background: var(--surface-2); color: var(--muted); border: 1px solid transparent; cursor: pointer;
}
.pill.active { background: var(--blue); color: #fff; }
.cat-header {
  background: var(--surface-2); padding: 14px 16px; border-radius: 12px;
  display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; cursor: pointer;
}
.p-card { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; border: 1px solid var(--border); }
.p-top { display: flex; gap: 14px; align-items: center; }
.p-thumb {
  width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
  background: var(--surface-2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden;
}
.p-thumb img { width: 100%; height: 100%; object-fit: cover; }
.low-tag { background: var(--red-bg); color: var(--red); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
.rem-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.rem-input {
  width: 90px; height: 48px; text-align: center; font-size: 22px; font-weight: 700;
  border: 2px solid var(--blue); background: var(--surface); border-radius: 12px; padding: 0;
}
.rem-input:focus { border-color: var(--blue-light); }
.quick-btns { display: flex; gap: 10px; }
.q-btn {
  padding: 8px 18px; border-radius: 20px; background: var(--surface-2); border: none;
  color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
}
.q-btn:active { background: var(--blue); color: #fff; }
.ws-box { border: 1px dashed var(--border); border-radius: 12px; padding: 12px; margin-top: 4px; }
.ws-title { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.ws-grid { display: grid; grid-template-columns: 80px 1fr; gap: 10px; }
.ws-label { font-size: 13px; color: var(--muted); align-self: center; }
.ws-input { text-align: center; font-weight: 600; height: 40px; padding: 8px; }
.calc-box { background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.calc-item { font-weight: 600; color: var(--text); }
.calc-item.warn { color: var(--red); }
.calc-item.ok { color: var(--green); }
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
  background: var(--surface); border-radius: 16px;
  width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
  background: var(--surface-2); color: var(--muted); cursor: pointer;
}
.chip.selected { background: var(--blue); color: #fff; }
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 99;
  background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <div class="shop-title" id="hdrShopName">大成</div>
    <div class="shop-sub" id="hdrSub">最后盘点 -- · 0 个产品</div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="切换主题">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>

</header>

<main id="mainApp"></main>

<div id="floatingBar">
  <button class="btn btn-dark" style="flex:1; border:1px solid var(--border);" onclick="fillSameAsYesterday()">和昨天一样</button>
  <button class="btn btn-blue" style="flex:2;" id="btnSendWa" onclick="openWaModal()">发送至 WhatsApp (0/0)</button>
</div>

<nav>
  <button class="nav-item active" data-tab="count" onclick="switchTab('count')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>盘点</span>
  </button>
  <button class="nav-item" data-tab="purchase" onclick="switchTab('purchase')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M2 4h20v4H2z"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/></svg>
    <span>进货</span>
  </button>
  <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    <span>统计</span>
  </button>
  <button class="nav-item" data-tab="products" onclick="switchTab('products')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4v10l8 4 8-4z"/><path d="M4 7l8 4 8-4"/><path d="M12 21V11"/></svg>
    <span>产品</span>
  </button>
  <button class="nav-item" data-tab="settings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.4.65.74.85.34.2.73.3 1.12.3H21a2 2 0 1 1 0 4h-.09c-.39 0-.78.1-1.12.3-.34.2-.6.5-.74.85z"></path></svg>
    <span>设定</span>
  </button>
</nav>

<div id="toast" class="toast"></div>
<div id="modalLayer"></div>

<script>
// ================= 基础数据 =================
var DEFAULT_CATEGORIES = ['蔬菜和菇','豆类','培根类','鸡肉类','鸭肉类','猪肉类','蛋类','海鲜类','丸类','香肠类','肉片类','馒头类','其他类','酱料类'];

var PRESET_PRODUCTS = [
  { id:'p1', name:'KING OYSTER 杏鲍菇', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🍄', packQty:10, packCost:3.50 },
  { id:'p2', name:'BUNA SHIMEIJI 灵芝菇', price:0.55, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🍄', packQty:20, packCost:6.00 },
  { id:'p3', name:'SHITAKE 花菇', price:0.60, cat:'蔬菜和菇', spec:'1 stick*2', unit:'支', low:20, emoji:'🍄', packQty:1, packCost:0 },
  { id:'p4', name:'JAGUNG 玉蜀黍（大）', price:0.60, cat:'蔬菜和菇', spec:'10 Sticks/bag', unit:'支', low:20, emoji:'🌽', packQty:10, packCost:5.00 },
  { id:'p5', name:'WHITE BUTTON MUSHROOM 白蘑菇', price:0.55, cat:'蔬菜和菇', spec:'20 Sticks/bag', unit:'支', low:20, emoji:'🍄', packQty:20, packCost:9.00 },
  { id:'p6', name:'KACANG PANJANG 长豆', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🥬', packQty:1, packCost:0 },
  { id:'p7', name:'BENDI 羊角豆', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:20, emoji:'🥬', packQty:1, packCost:0 },
  { id:'p8', name:'BABY BRINJAL 茄子', price:0.50, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🍆', packQty:1, packCost:0 },
  { id:'p9', name:'ABALONE MUSHROOM 鲍鱼菇', price:0.55, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🍄', packQty:1, packCost:0 },
  { id:'p10', name:'BROCCOLI 西兰花', price:0.60, cat:'蔬菜和菇', spec:'1 stick', unit:'支', low:15, emoji:'🥦', packQty:1, packCost:0 },
  { id:'p11', name:'TAU POK 豆卜', price:0.50, cat:'豆类', spec:'1 stick', unit:'支', low:20, emoji:'🟨', packQty:1, packCost:0 },
  { id:'p12', name:'FU CHUK 炸腐竹', price:0.60, cat:'豆类', spec:'1 stick', unit:'支', low:20, emoji:'捲', packQty:1, packCost:0 },
  { id:'p13', name:'BACON ENOKI 培根金针菇', price:1.20, cat:'培根类', spec:'1 stick', unit:'支', low:15, emoji:'🥓', packQty:1, packCost:0 },
  { id:'p14', name:'SMOKED DUCK 烟熏鸭胸', price:1.20, cat:'鸭肉类', spec:'1 stick', unit:'支', low:15, emoji:'🦆', packQty:1, packCost:0 },
  { id:'p15', name:'CHICKEN MID WING 鸡中翅', price:1.50, cat:'鸡肉类', spec:'1 stick', unit:'支', low:15, emoji:'🍗', packQty:1, packCost:0 },
  { id:'p16', name:'PORK BELLY 五花肉片', price:1.20, cat:'猪肉类', spec:'1 stick', unit:'支', low:15, emoji:'🥩', packQty:1, packCost:0 },
  { id:'p17', name:'QUAIL EGG 鹌鹑蛋', price:0.80, cat:'蛋类', spec:'1 stick3', unit:'支', low:15, emoji:'🥚', packQty:1, packCost:0 },
  { id:'p18', name:'PRAWN 鲜虾串', price:1.50, cat:'海鲜类', spec:'1 stick', unit:'支', low:15, emoji:'🦐', packQty:1, packCost:0 },
  { id:'p19', name:'75 MEATBALL 肉丸', price:0.60, cat:'丸类', spec:'1 stick3', unit:'支', low:20, emoji:'🍡', packQty:1, packCost:0 },
  { id:'p20', name:'CHEESE TOFU 芝士豆腐', price:0.70, cat:'丸类', spec:'1 stick2', unit:'支', low:20, emoji:'🧀', packQty:1, packCost:0 },
  { id:'p21', name:'TAIWAN SAUSAGE 台湾香肠', price:1.20, cat:'香肠类', spec:'1 stick', unit:'支', low:15, emoji:'🌭', packQty:1, packCost:0 },
  { id:'p22', name:'MANTOU 黄金小馒头', price:0.60, cat:'馒头类', spec:'1 stick*2', unit:'支', low:15, emoji:'🥯', packQty:1, packCost:0 }
];

var K_PRODS = 'dc_v3_products';
var K_RECS  = 'dc_v3_records';
var K_CFG   = 'dc_v3_settings';

var appState = {
  tab: 'count',
  date: getLocalDate(0),
  purchaseDate: getLocalDate(0),
  selectedCat: 'ALL',
  search: '',
  collapsedCats: {},
  statsDays: 7,
  statsView: 'chart',
  products: JSON.parse(localStorage.getItem(K_PRODS) || '[]'),
  records: JSON.parse(localStorage.getItem(K_RECS) || '{}'),
  settings: JSON.parse(localStorage.getItem(K_CFG) || JSON.stringify({
    shopName: '大成', defaultLow: 5, whatsapp: '', categories: DEFAULT_CATEGORIES.slice()
  }))
};
if (!appState.settings.categories) appState.settings.categories = DEFAULT_CATEGORIES.slice();

// ================= 工具函数 =================
function getLocalDate(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().split('T')[0];
}
function formatCnDate(dateStr) {
  if (!dateStr) return '--';
  var parts = dateStr.split('-');
  return Number(parts[1]) + '月' + Number(parts[2]) + '日';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function saveStore() {
  localStorage.setItem(K_PRODS, JSON.stringify(appState.products));
  localStorage.setItem(K_RECS, JSON.stringify(appState.records));
  localStorage.setItem(K_CFG, JSON.stringify(appState.settings));
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function toggleTheme() { /* 保持截图暗黑风格，不做亮色切换了，避免破坏美感 */ toast('当前为深色模式'); }
function getProd(pid) {
  for (var i = 0; i < appState.products.length; i++) if (appState.products[i].id === pid) return appState.products[i];
  return null;
}
function getLastRecordBefore(prodId, dateStr) {
  var prevDates = Object.keys(appState.records).filter(function(d){ return d < dateStr; }).sort().reverse();
  for (var i = 0; i < prevDates.length; i++) {
    var d = prevDates[i];
    var r = appState.records[d] && appState.records[d][prodId];
    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) return { date: d, rem: Number(r.rem) };
  }
  return null;
}
function isDateEditable(dateStr) { return dateStr >= getLocalDate(-2); }
function getPurchase(dateStr, pid) {
  var r = appState.records[dateStr] && appState.records[dateStr][pid];
  return (r && r.purchase) ? r.purchase : null;
}

function calcDayStats(dateStr) {
  var dayMap = appState.records[dateStr] || {};
  var filled = 0, soldCount = 0, purchaseQty = 0, purchaseCost = 0, wasteCount = 0, wasteAmt = 0, salesAmt = 0;
  appState.products.forEach(function(p){
    var r = dayMap[p.id];
    var pc = getPurchase(dateStr, p.id);
    var pq = pc ? Number(pc.qty) : 0;
    if (pq > 0) { purchaseQty += pq; purchaseCost += Number(pc.totalCost) || 0; }

    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      filled++;
      var curRem = Number(r.rem);
      var prev = getLastRecordBefore(p.id, dateStr);
      if (prev) {
        var sold = prev.rem + pq - Number(r.waste || 0) - curRem;
        if (sold > 0) { soldCount += sold; salesAmt += sold * p.price; }
      }
    }
    if (r && Number(r.waste) > 0) {
      wasteCount += Number(r.waste);
      wasteAmt += Number(r.waste) * p.price;
    }
  });
  return { filled: filled, total: appState.products.length, soldCount: soldCount, salesAmt: salesAmt, purchaseQty: purchaseQty, purchaseCost: purchaseCost, wasteCount: wasteCount, wasteAmt: wasteAmt };
}

// ================= 渲染路由 =================
function render() {
  var recordedDates = Object.keys(appState.records).sort().reverse();
  var lastDate = recordedDates.length ? formatCnDate(recordedDates[0]) : '暂无';
  document.getElementById('hdrShopName').textContent = appState.settings.shopName || '大成';
  document.getElementById('hdrSub').textContent = '最后盘点 ' + lastDate + ' · ' + appState.products.length + ' 个产品';

  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.tab === appState.tab); });
  document.getElementById('floatingBar').style.display = (appState.tab === 'count') ? 'flex' : 'none';

  var main = document.getElementById('mainApp');
  if (appState.tab === 'count') main.innerHTML = viewCount();
  else if (appState.tab === 'purchase') main.innerHTML = viewPurchase();
  else if (appState.tab === 'stats') main.innerHTML = viewStats();
  else if (appState.tab === 'products') main.innerHTML = viewProducts();
  else if (appState.tab === 'settings') main.innerHTML = viewSettings();
}

// ================= 盘点页面 =================
function viewCount() {
  var stats = calcDayStats(appState.date);
  var editable = isDateEditable(appState.date);
  var btn = document.getElementById('btnSendWa');
  if (btn) btn.textContent = '发送至 WhatsApp (' + stats.filled + '/' + stats.total + ')';

  var cats = appState.settings.categories || DEFAULT_CATEGORIES;
  var filtered = appState.products.filter(function(p){
    return (appState.selectedCat === 'ALL' || p.cat === appState.selectedCat) && p.name.toLowerCase().indexOf(appState.search.toLowerCase()) > -1;
  });
  var groups = {};
  filtered.forEach(function(p){ if (!groups[p.cat]) groups[p.cat] = []; groups[p.cat].push(p); });

  var html = '<div class="card" style="padding:12px;display:flex;gap:12px;align-items:center;">' +
    '<div style="font-size:15px;font-weight:600;white-space:nowrap;">盘点日期</div>' +

function renderCountCard(p, editable) {
  var rec = (appState.records[appState.date] && appState.records[appState.date][p.id]) || {};
  var pc = getPurchase(appState.date, p.id) || { qty: 0 };
  var prev = getLastRecordBefore(p.id, appState.date);
  var hasRem = rec.rem !== '' && rec.rem !== undefined;
  var isLow = hasRem && Number(rec.rem) <= p.low;
  var disAttr = !editable ? 'disabled' : '';

  var thumb = p.img ? '<img src="' + p.img + '">' : (p.emoji || '🍢');
  var prevText = prev ? ('上次' + formatCnDate(prev.date) + '是 ' + prev.rem + ' ' + p.unit) : '首次盘点';
  var lowHtml = isLow ? '<span class="low-tag">库存偏低</span>' : '';

  // 推算销售逻辑
  var sold = '';
  if (prev && hasRem) {
    var calc = prev.rem + pc.qty - Number(rec.waste||0) - Number(rec.rem);
    sold = '<span class="calc-item ' + (calc < 0 ? 'warn' : 'ok') + '">推算销售: ' + calc + ' 支</span>';
  } else {
    sold = '<span class="calc-item" style="color:var(--muted);">推算销售: -</span>';
  }

  var calcHtml = '<div class="calc-box">' +
    '<span>上次: ' + (prev ? prev.rem : '-') + '</span>' +
    '<span>+ 进货: ' + pc.qty + '</span>' +
    '<span>- 损耗: ' + (rec.waste||0) + '</span>' +
    sold +
  '</div>';

  return '<div class="p-card">' +
    '<div class="p-top">' +
      '<div class="p-thumb">' + thumb + '</div>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:700;font-size:16px;">' + esc(p.name) + '</div>' +
        '<div style="font-size:13px;color:var(--muted);margin-top:4px;">' + esc(p.cat) + '  RM ' + Number(p.price).toFixed(2) + '  ' + esc(p.spec) + '</div>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + prevText + lowHtml + '</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<div style="font-size:16px;font-weight:700;color:var(--blue);">今日进货</div>' +
        '<div style="font-size:14px;font-weight:600;">' + pc.qty + ' 支</div>' +
      '</div>' +
    '</div>' +
    '<div class="rem-row">' +
      '<span style="font-size:14px;color:var(--muted);">剩余数量:</span>' +
      '<input type="number" min="0" class="rem-input" ' + disAttr + ' value="' + (hasRem ? rec.rem : '') + '" placeholder="-" onchange="updateRec(\'' + p.id + '\',\'rem\',this.value)">' +
      '<span style="font-size:14px;color:var(--muted);">' + esc(p.unit) + '</span>' +
    '</div>' +
    '<div class="quick-btns">' +
      '<button class="q-btn" ' + disAttr + ' onclick="quickSetRem(\'' + p.id + '\',\'10\')">10</button>' +
      '<button class="q-btn" ' + disAttr + ' onclick="quickSetRem(\'' + p.id + '\',\'30\')">30</button>' +
      '<button class="q-btn" ' + disAttr + ' onclick="quickSetRem(\'' + p.id + '\',\'50\')">50</button>' +
    '</div>' +
    '<div class="ws-box">' +
      '<div class="ws-title">损耗 WS</div>' +
      '<div class="ws-grid">' +
        '<div class="ws-label">个数</div>' +
        '<input type="number" min="0" class="ws-input" ' + disAttr + ' style="width:80px;" value="' + (rec.waste || 0) + '" onchange="updateRec(\'' + p.id + '\',\'waste\',this.value)">' +
        '<div class="ws-label">原因</div>' +
        '<input type="text" class="ws-input" ' + disAttr + ' placeholder="原因（可不填）" value="' + esc(rec.wasteReason || '') + '" onchange="updateRec(\'' + p.id + '\',\'wasteReason\',this.value)">' +
      '</div>' +
    '</div>' +
    calcHtml +
  '</div>';
}

function changePurchaseDate(d) { appState.purchaseDate = d; render(); }
function setPurchaseUnit(pid, u) {
  if (!appState.records[appState.purchaseDate]) appState.records[appState.purchaseDate] = {};
  if (!appState.records[appState.purchaseDate][pid]) appState.records[appState.purchaseDate][pid] = { rem:'', waste:0, wasteReason:'' };
  if (!appState.records[appState.purchaseDate][pid].purchase) appState.records[appState.purchaseDate][pid].purchase = { inputQty:0, unit:u, qty:0, packCost:0, totalCost:0 };
  appState.records[appState.purchaseDate][pid].purchase.unit = u;
  saveStore(); render();
}
function updatePurchase(pid, field, val) {
  if (!isDateEditable(appState.purchaseDate)) return toast('历史记录不可修改');
  var p = getProd(pid); if (!p) return;
  if (!appState.records[appState.purchaseDate]) appState.records[appState.purchaseDate] = {};
  if (!appState.records[appState.purchaseDate][pid]) appState.records[appState.purchaseDate][pid] = { rem:'', waste:0, wasteReason:'' };
  var rec = appState.records[appState.purchaseDate][pid];
  if (!rec.purchase) rec.purchase = { inputQty:0, unit:'pack', qty:0, packCost:0, totalCost:0 };

  if (field === 'inputQty') rec.purchase.inputQty = val === '' ? 0 : Number(val);
  else if (field === 'packCost') rec.purchase.packCost = val === '' ? 0 : Number(val);

  var packQty = Number(p.packQty) || 1;
  var inputQty = rec.purchase.inputQty;
  var packCost = rec.purchase.packCost;
  var qty = rec.purchase.unit === 'pack' ? inputQty * packQty : inputQty;
  var total = rec.purchase.unit === 'pack' ? inputQty * packCost : qty * (packQty > 0 ? packCost / packQty : 0);
  
  rec.purchase.qty = qty;
  rec.purchase.totalCost = Math.round(total * 100) / 100;
  saveStore(); render();
}

// ================= 交互函数 =================
function switchTab(t) { appState.tab = t; appState.search = ''; render(); window.scrollTo(0, 0); }
function changeDate(d) { appState.date = d; render(); }
function setSearch(q) { appState.search = q; render(); }
function selectCat(c) { appState.selectedCat = c; render(); }
function toggleCat(c) { appState.collapsedCats[c] = !appState.collapsedCats[c]; render(); }
function toggleCollapseAll() {
  var cats = appState.settings.categories || DEFAULT_CATEGORIES;
  var anyOpen = cats.some(function(c){ return !appState.collapsedCats[c]; });
  cats.forEach(function(c){ appState.collapsedCats[c] = anyOpen; });
  render();
}
function openHistoryDate(d) { appState.date = d; appState.tab = 'count'; render(); }
function updateRec(pid, field, val) {
  if (!isDateEditable(appState.date)) return toast('超过3天的历史记录不可修改');
  if (!appState.records[appState.date]) appState.records[appState.date] = {};
  if (!appState.records[appState.date][pid]) appState.records[appState.date][pid] = { rem:'', waste:0, wasteReason:'' };
  if (field === 'rem') appState.records[appState.date][pid].rem = (val === '' ? '' : Number(val));
  else if (field === 'waste') appState.records[appState.date][pid].waste = (val === '' ? 0 : Number(val));
  else appState.records[appState.date][pid].wasteReason = val;
  saveStore(); render();
}
function quickSetRem(pid, num) { updateRec(pid, 'rem', num); }
function fillSameAsYesterday() {
  if (!isDateEditable(appState.date)) return toast('只读日期无法修改');
  if (!appState.records[appState.date]) appState.records[appState.date] = {};
  var cnt = 0;
  appState.products.forEach(function(p){
    var cur = appState.records[appState.date][p.id];
    if (!cur || cur.rem === '' || cur.rem === undefined) {
      var prev = getLastRecordBefore(p.id, appState.date);
      if (prev) {
        appState.records[appState.date][p.id] = { rem: prev.rem, waste: 0, wasteReason: '' };
        cnt++;
      }
    }
  });
  saveStore(); render(); toast('已自动补齐 ' + cnt + ' 个未动产品');
}
function saveSettingsNow() {
  appState.settings.shopName = document.getElementById('setShop').value.trim() || '大成';
  appState.settings.defaultLow = Number(document.getElementById('setLow').value) || 5;
  appState.settings.whatsapp = document.getElementById('setWa').value.replace(/\D/g, '');
  saveStore(); render(); toast('设定已保存');
}

  chips += '<div class="chip" onclick="addNewCategory(' + (pid ? '\'' + pid + '\'' : 'null') + ')">+ 新分类</div>';
  
  var imgHtml = editingProdImg ? '<img src="' + editingProdImg + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">' : (p.emoji || '🍢');
  var delBtn = pid ? '<button class="btn btn-dark" style="color:var(--red);flex:1;" onclick="deleteProd(\'' + pid + '\')">删除</button>' : '';

  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-size:18px;font-weight:700;">' + (pid ? '编辑产品' : '新增产品') + '</div>' +
          '<button class="btn btn-dark" style="border-radius:50%;width:32px;height:32px;padding:0;" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div>' +
          '<div style="font-size:13px;color:var(--muted);margin-bottom:8px;">照片</div>' +
          '<div style="display:flex;gap:12px;align-items:center;">' +
            '<div class="p-thumb" id="imgPreviewBox" style="width:80px;height:80px;">' + imgHtml + '</div>' +
            '<div style="flex:1;">' +
              '<label class="btn btn-dark btn-full" style="cursor:pointer;margin-bottom:6px;">拍照 / 选图<input type="file" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)"></label>' +
              '<div style="font-size:12px;color:var(--muted);">内建照片。可以拍一张自己的取代它。</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">产品名称</div><input id="edName" value="' + esc(p.name) + '"></div>' +
        '<div style="display:flex;gap:12px;">' +
          '<div style="flex:1;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">售价 RM</div><input id="edPrice" type="number" step="0.01" value="' + (p.price || '') + '"></div>' +
          '<div style="flex:2;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">分类</div><div class="cat-chips" id="catChipsBox" style="max-height:80px;overflow-y:auto;">' + chips + '</div></div>' +
        '</div>' +
        '<div style="display:flex;gap:12px;">' +
          '<div style="flex:1;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">包装规格</div><input id="edSpec" value="' + esc(p.spec) + '"></div>' +
          '<div style="width:80px;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">单位</div><input id="edUnit" value="' + esc(p.unit) + '"></div>' +
        '</div>' +
        '<div style="display:flex;gap:12px;">' +
          '<div style="flex:1;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">每包数量</div><input id="edPackQty" type="number" min="1" value="' + (p.packQty || 1) + '"></div>' +
          '<div style="flex:1;"><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">每包成本 RM</div><input id="edPackCost" type="number" step="0.01" value="' + (p.packCost || 0) + '"></div>' +
        '</div>' +
        '<div><div style="font-size:13px;color:var(--muted);margin-bottom:6px;">低库存提醒值</div><input id="edLow" type="number" value="' + (p.low || 5) + '"></div>' +
        '<div style="display:flex;gap:10px;margin-top:10px;">' + delBtn +
          '<button class="btn btn-blue" style="flex:2;" onclick="saveProdEditor(' + (pid ? '\'' + pid + '\'' : 'null') + ')">保存产品</button></div>' +
      '</div>' +
    '</div>';
}
function pickModalCat(btn, cat) {
  editingProdCat = cat;
  document.querySelectorAll('#catChipsBox .chip').forEach(function(el){ el.classList.remove('selected'); });
  btn.classList.add('selected');
}
function addNewCategory(pid) {
  var name = prompt('请输入新分类名称：');
  if (!name || !name.trim()) return;
  var clean = name.trim();
  if (appState.settings.categories.indexOf(clean) === -1) { appState.settings.categories.push(clean); saveStore(); }
  editingProdCat = clean;
  openProdEditor(pid || null);
}
function handlePhotoUpload(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var maxW = 180, scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      editingProdImg = canvas.toDataURL('image/jpeg', 0.72);
      document.getElementById('imgPreviewBox').innerHTML = '<img src="' + editingProdImg + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function saveProdEditor(pid) {
  var name = document.getElementById('edName').value.trim();
  var price = parseFloat(document.getElementById('edPrice').value) || 0;
  var spec = document.getElementById('edSpec').value.trim() || '1 stick';
  var unit = document.getElementById('edUnit').value.trim() || '支';
  var packQty = parseInt(document.getElementById('edPackQty').value) || 1;
  var packCost = parseFloat(document.getElementById('edPackCost').value) || 0;
  var low = parseInt(document.getElementById('edLow').value) || 5;
  if (!name) return toast('请输入产品名称');
  
  if (pid) {
    var p = getProd(pid);
    p.name = name; p.price = price; p.spec = spec; p.unit = unit; p.packQty = packQty; p.packCost = packCost; p.low = low; p.cat = editingProdCat; p.img = editingProdImg;
  } else {
    appState.products.push({ id:'p_' + Date.now(), name:name, price:price, spec:spec, unit:unit, packQty:packQty, packCost:packCost, low:low, cat:editingProdCat, img:editingProdImg, emoji:'🍢' });
  }
  saveStore(); closeModal(); render(); toast('已保存');
}
function deleteProd(pid) {
  if (!confirm('确定删除此产品？')) return;
  appState.products = appState.products.filter(function(x){ return x.id !== pid; });
  saveStore(); closeModal(); render(); toast('已删除');
}
function closeModal() { document.getElementById('modalLayer').innerHTML = ''; }

// ================= 报告与备份 =================
function openWaModal() {
  var s = calcDayStats(appState.date);
  var lowList = [], wasteList = [], remLines = [], purLines = [];
  appState.products.forEach(function(p){
    var r = appState.records[appState.date] && appState.records[appState.date][p.id];
    var pc = getPurchase(appState.date, p.id);
    if (pc && pc.qty) purLines.push('• ' + p.name + ': +' + pc.qty + p.unit + ' (RM ' + pc.totalCost.toFixed(2) + ')');
    if (r && r.rem !== '' && r.rem !== undefined) {
      remLines.push('• ' + p.name + ': ' + r.rem + p.unit);
      if (Number(r.rem) <= p.low) lowList.push('• ' + p.name + ': 剩 ' + r.rem + p.unit + ' (警戒≤' + p.low + ')');
    }
    if (r && Number(r.waste) > 0) {
      wasteList.push('• ' + p.name + ': ' + r.waste + p.unit + ' (RM ' + (r.waste * p.price).toFixed(2) + ') ' + (r.wasteReason ? '[' + r.wasteReason + ']' : ''));
    }
  });
  var text = '📋【' + appState.settings.shopName + '】盘点报告\n' +
    '📅 日期：' + appState.date + '\n' +
    '✅ 进度：已盘点 ' + s.filled + ' / ' + s.total + ' 项\n' +
    '━━━━━━━━━━━━━━━\n' +
    '📦 进货：' + s.purchaseQty + ' 支 (成本 RM ' + s.purchaseCost.toFixed(2) + ')\n' + (purLines.length ? purLines.join('\n') + '\n' : '') +
    '📉 推算销售：' + s.soldCount + ' 支 (约 RM ' + s.salesAmt.toFixed(2) + ')\n' +
    '🗑️ 损耗：' + s.wasteCount + ' 支 (RM ' + s.wasteAmt.toFixed(2) + ')\n' +
    '━━━━━━━━━━━━━━━\n' +
    '🚨 低库存提醒 (' + lowList.length + ')：\n' + (lowList.length ? lowList.join('\n') : '无') + '\n\n' +
    '⚠️ 损耗明细：\n' + (wasteList.length ? wasteList.join('\n') : '无') + '\n\n' +
    '📦 已盘点剩余：\n' + (remLines.length ? remLines.join('\n') : '暂未填写');
  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-size:18px;font-weight:700;">WhatsApp 报告</div>' +
          '<button class="btn btn-dark" style="border-radius:50%;width:32px;height:32px;padding:0;" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<textarea id="waFinalText" rows="14" style="font-family:monospace;font-size:13px;line-height:1.5;">' + esc(text) + '</textarea>' +
        '<div style="display:flex;gap:10px;">' +
          '<button class="btn btn-dark" style="flex:1;" onclick="copyReportText()">复制文字</button>' +
          '<button class="btn btn-blue" style="flex:2;" onclick="launchWhatsApp()">发送至 WhatsApp</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
function copyReportText() {
  var el = document.getElementById('waFinalText');
  el.select(); navigator.clipboard.writeText(el.value); toast('已复制到剪贴板');
}
function launchWhatsApp() {
  var msg = encodeURIComponent(document.getElementById('waFinalText').value);
  var phone = appState.settings.whatsapp;
  window.open(phone ? ('https://wa.me/' + phone + '?text=' + msg) : ('https://wa.me/?text=' + msg), '_blank');
}
function loadPresetList() {
  var added = 0;
  PRESET_PRODUCTS.forEach(function(item){
    if (!appState.products.some(function(p){ return p.name === item.name; })) {
      appState.products.push(item); added++;
    }
  });
  saveStore(); render(); toast(added ? ('已载入 ' + added + ' 项产品') : '已存在');
}
function exportExcelCsv() {
  if (!appState.products.length) return toast('暂无产品');
  var header = ['日期,分类,产品名称,售价,进货包数,进货支数,进货成本,上次剩余,今日剩余,损耗个数,推算销售'];
  var lines = appState.products.map(function(p){
    var r = (appState.records[appState.date] && appState.records[appState.date][p.id]) || {};
    var pc = getPurchase(appState.date, p.id) || { inputQty:'', qty:'', totalCost:'' };
    var prev = getLastRecordBefore(p.id, appState.date);
    var prevRem = prev ? prev.rem : '';
    var rem = (r.rem !== '' && r.rem !== undefined) ? r.rem : '';
    var waste = r.waste || 0;
    var sold = (prev && rem !== '') ? (prev.rem + (pc.qty || 0) - waste - Number(rem)) : '';
    return appState.date + ',"' + p.cat + '","' + p.name + '",' + p.price + ',' + (pc.inputQty||'') + ',' + (pc.qty||'') + ',' + (pc.totalCost||'') + ',' + prevRem + ',' + rem + ',' + waste + ',' + sold;
  });
  var blob = new Blob(['\uFEFF' + header.concat(lines).join('\n')], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = appState.settings.shopName + '报表' + appState.date + '.csv'; a.click();
  toast('报表已导出');
}
function exportJsonBackup() {
  var blob = new Blob([JSON.stringify({ products:appState.products, records:appState.records, settings:appState.settings }, null, 2)], { type:'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '大成备份_' + getLocalDate(0) + '.json'; a.click();
}
function importJsonBackup(e) {
  var f = e.target.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var d = JSON.parse(ev.target.result);
      if (d.products) appState.products = d.products;
      if (d.records) appState.records = d.records;
      if (d.settings) appState.settings = d.settings;
      saveStore(); render(); toast('备份还原成功');
    } catch (err) { toast('文件格式错误'); }
  };
  reader.readAsText(f);
}
function clearEverything() {
  if (!confirm('⚠️ 确定要清空全部资料吗？')) return;
  appState.products = []; appState.records = [];
  saveStore(); render(); toast('已清空');
}

render();
</script>
