<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>大成loklok 库存管理系统</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
--bg: #0f1115; --surface: #181b21; --surface-2: #22262f; --border: #2c313d;
--text: #f3f4f6; --muted: #9ca3af; --blue: #2563eb; --blue-light: #3b82f6;
--red-bg: rgba(239, 68, 68, 0.16); --red-text: #f87171; --green-text: #34d399;
}
body.light-mode {
--bg: #f3f4f6; --surface: #ffffff; --surface-2: #e5e7eb; --border: #d1d5db;
--text: #111827; --muted: #6b7280; --red-bg: #fee2e2; --red-text: #dc2626; --green-text: #059669;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
background: var(--bg); color: var(--text);
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
padding-top: calc(64px + env(safe-area-inset-top));
padding-bottom: calc(132px + env(safe-area-inset-bottom));
min-height: 100vh; transition: background 0.2s, color 0.2s;
}
header {
position: fixed; top: 0; left: 0; right: 0; z-index: 40;
height: calc(64px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0;
background: var(--bg); border-bottom: 1px solid var(--border);
display: flex; align-items: center; justify-content: space-between;
}
.shop-title { font-size: 19px; font-weight: 800; }
.shop-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.theme-btn {
width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
main { max-width: 600px; margin: 0 auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
#floatingBar {
position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 35;
background: var(--bg); border-top: 1px solid var(--border); padding: 8px 14px;
}
.float-inner { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
nav {
position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
height: calc(62px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
background: var(--surface); border-top: 1px solid var(--border);
display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav-item {
background: none; border: none; color: var(--muted);
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
font-size: 11px; font-weight: 600; cursor: pointer;
}
.nav-item svg { width: 21px; height: 21px; }
.nav-item.active { color: var(--blue-light); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.card-hd { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
input, select, textarea {
width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none;
}
input:focus, textarea:focus { border-color: var(--blue-light); }
input:disabled { opacity: 0.5; }
.btn {
border: none; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 700;
cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(0.98); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-dark { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn-full { width: 100%; }
.pills-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.pills-row::-webkit-scrollbar { display: none; }
.pill {
white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer;
}
.pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.cat-header {
background: var(--surface-2); padding: 11px 14px; border-radius: 12px;
display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; cursor: pointer;
}
.p-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.p-top { display: flex; gap: 12px; align-items: center; }
.p-thumb {
width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
background: var(--surface-2); border: 1px solid var(--border); flex-shrink: 0;
display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--muted); overflow: hidden;
}
.p-thumb img { width: 100%; height: 100%; object-fit: cover; }
.low-tag { background: var(--red-bg); color: var(--red-text); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-left: 6px; }
.rem-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.rem-input {
width: 105px; height: 44px; text-align: center; font-size: 18px; font-weight: 800;
border: 2px solid var(--blue); background: var(--bg); border-radius: 10px;
}
.rem-input:disabled { border-color: var(--border); }
.quick-btns { display: flex; gap: 8px; }
.q-btn {
padding: 6px 14px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--border);
color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
}
.q-btn:active { background: var(--blue); color: #fff; }
.q-btn:disabled { opacity: 0.5; }
.ws-box { border-top: 1px solid var(--border); padding-top: 10px; }
.ws-grid { display: grid; grid-template-columns: 95px 1fr; gap: 8px; margin-top: 6px; }
.prog-track { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.prog-fill { height: 100%; background: var(--blue-light); transition: width 0.25s; }
.modal-bg {
position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60;
display: flex; align-items: center; justify-content: center; padding: 14px;
}
.modal-card {
background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
padding: 7px 13px; border-radius: 18px; font-size: 13px; font-weight: 600;
background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer;
}
.chip.selected { background: var(--blue); color: #fff; border-color: var(--blue); }
.toast {
position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 99;
background: #1f2937; color: #fff; border: 1px solid var(--blue-light);
padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
.info-quote { background: var(--surface-2); border-left: 3px solid var(--blue-light); padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }

.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.dash-lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.dash-val { font-size: 18px; font-weight: 800; color: var(--text); }
.dash-val.blue { color: var(--blue-light); }
.dash-val.red { color: var(--red-text); }
.dash-val.green { color: var(--green-text); }

.hist-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.hist-row:last-child { border-bottom: none; }
.hist-date { font-weight: 700; width: 80px; }
.hist-detail { flex: 1; color: var(--muted); text-align: right; }

.calc-box {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
  background: var(--surface-2); border-radius: 8px; padding: 8px 12px;
  font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px;
}
.calc-item { color: var(--text); }
.calc-item.green { color: var(--green-text); }
.calc-item.red { color: var(--red-text); }
.log-list { font-size: 12px; color: var(--muted); line-height: 1.8; max-height: 200px; overflow-y: auto; }
.log-item { border-bottom: 1px solid var(--border); padding: 6px 0; }

/* 搜索框包裹器与清空按钮 */
.search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
.search-wrapper input { padding-right: 35px; }
.clear-btn {
  position: absolute; right: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--border); color: var(--text); display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; border: none;
}
</style>
</head>

// 【核心修复 1】营业日跨天逻辑
function getLocalDate(offset) {
  offset = offset || 0;
  var d = new Date();
  
  if (d.getHours() < 5) {
    d.setDate(d.getDate() - 1);
  }
  
  d.setDate(d.getDate() + offset);
  var tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().split('T')[0];
}
function formatCnDate(dateStr) {
  if (!dateStr) return '--';
  var parts = dateStr.split('-');
  return Number(parts[1]) + '月' + Number(parts[2]) + '日';
}
function formatCnDateWeek(dateStr) {
  var weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var dt = new Date(dateStr + 'T00:00:00');
  return formatCnDate(dateStr) + weeks[dt.getDay()];
}
function getNowStr() {
  var d = new Date();
  return d.getFullYear() + '-' + padZero(d.getMonth()+1) + '-' + padZero(d.getDate()) + ' ' + padZero(d.getHours()) + ':' + padZero(d.getMinutes());
}
function padZero(n) { return n < 10 ? '0' + n : n; }
function escapeCSV(str) {
  if (str === null || str === undefined) return '""';
  var s = String(str);
  return '"' + s.replace(/"/g, '""') + '"';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function saveStore() {

}

function toast(msg) {

  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2200);
}

function getProd(pid) {
  for (var i = 0; i < appState.products.length; i++) if (appState.products[i].id === pid) return appState.products[i];
  return null;
}
function getLastRecordBefore(prodId, dateStr) {
  var prevDates = Object.keys(appState.records).filter(function(d) { return d < dateStr && d !== '__status'; }).sort().reverse();
  for (var i = 0; i < prevDates.length; i++) {
    var d = prevDates[i];
    var r = appState.records[d] && appState.records[d][prodId];
    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      return { date: d, rem: Number(r.rem) };
    }
  }
  return null;
}

function getStartStock(p, dateStr) {
  var prev = getLastRecordBefore(p.id, dateStr);
  if (prev) return { val: prev.rem, label: '上次 ' + formatCnDate(prev.date) };
  
  if (p.initialStock === undefined || p.initialStock === null || p.initialStock === '') {
    return { val: 0, label: '未设期初', notInit: true }; 
  }
  return { val: Number(p.initialStock), label: '期初' };
}

function isDateEditable(dateStr) {
  var minEditable = getLocalDate(-2);
  if (dateStr < minEditable) return false;
  var dayData = appState.records[dateStr];
  if (dayData && dayData.__status === 'confirmed') return false;
  return true;
}
function getPurchase(dateStr, pid) {
  var r = appState.records[dateStr] && appState.records[dateStr][pid];
  return (r && r.purchase) ? r.purchase : null;
}

function getUnitCost(p) {
  if (p.unitCost && Number(p.unitCost) > 0) return Number(p.unitCost);
  if (p.packCost && p.packQty && Number(p.packCost) > 0 && Number(p.packQty) > 0) {
    return Number(p.packCost) / Number(p.packQty);
  }
  return 0;
}

function calcDayStats(dateStr) {
  var dayMap = appState.records[dateStr] || {};
  var filled = 0, soldCount = 0, purchaseQty = 0, purchaseCost = 0, wasteCount = 0, wasteAmt = 0, salesAmt = 0, invValue = 0;
  var lowStockCount = 0;

  appState.products.forEach(function(p) {
    var r = dayMap[p.id];
    var pc = getPurchase(dateStr, p.id);
    var pq = pc ? Number(pc.qty) : 0;
    if (pq > 0) { purchaseQty += pq; purchaseCost += Number(pc.totalCost) || 0; }

    if (r && r.rem !== '' && r.rem !== undefined && r.rem !== null) {
      filled++;
      var curRem = Number(r.rem);
      if (curRem <= p.low) lowStockCount++;
      
      var unitCost = (r.costSnapshot !== undefined && r.costSnapshot > 0) ? Number(r.costSnapshot) : getUnitCost(p);
      if (r.costSnapshot === undefined && getUnitCost(p) > 0) r.costSnapshot = getUnitCost(p);
      
      invValue += curRem * unitCost;

      var startData = getStartStock(p, dateStr);
      var sold = startData.val + pq - Number(r.waste || 0) - curRem;
      if (sold > 0) { 
        soldCount += sold; 
        var pPrice = (r.priceSnapshot !== undefined) ? Number(r.priceSnapshot) : p.price;
        if (r.priceSnapshot === undefined) r.priceSnapshot = p.price;
        salesAmt += sold * pPrice; 
      }
    }
    if (r && Number(r.waste) > 0) {
      wasteCount += Number(r.waste);
      var wCost = Number(r.waste) * getUnitCost(p);
      if (r.wasteCost === undefined || r.wasteCost === 0) {
        r.wasteCost = wCost;
      }
      wasteAmt += Number(r.wasteCost);
    }
  });
  return { filled: filled, total: appState.products.length, soldCount: soldCount, salesAmt: salesAmt, purchaseQty: purchaseQty, purchaseCost: purchaseCost, wasteCount: wasteCount, wasteAmt: wasteAmt, invValue: invValue, lowStockCount: lowStockCount };
}

function changePurchaseDate(d) { appState.purchaseDate = d; appState.purchaseUnit = {}; render(); }
function setPurchaseUnit(pid, u) {
  if (!isDateEditable(appState.purchaseDate)) return;
  var p = getProd(pid); if (!p) return;
  
  if (!appState.records[appState.purchaseDate]) appState.records[appState.purchaseDate] = {};
  if (!appState.records[appState.purchaseDate][pid]) appState.records[appState.purchaseDate][pid] = { rem:'', waste:0, wasteReason:'' };
  
  var rec = appState.records[appState.purchaseDate][pid];
  if (!rec.purchase) rec.purchase = { inputQty:0, unit:u, qty:0, inputCost:0, unitCost:0, totalCost:0 };
  
  if (rec.purchase.unit !== u) {
    var oldUnit = rec.purchase.unit;
    var oldQty = rec.purchase.inputQty || 0;
    var packQty = Number(p.packQty) || 1;
    
    rec.purchase.unit = u;
    if (u === 'stick' && oldUnit === 'pack') {
      rec.purchase.inputQty = oldQty * packQty;
    } else if (u === 'pack' && oldUnit === 'stick') {
      rec.purchase.inputQty = Math.round(oldQty / packQty * 100) / 100;
    }
    
    rec.purchase.inputCost = u === 'pack' ? (Number(p.packCost) || 0) : (getUnitCost(p) || 0);
    
    updatePurchaseCalc(pid); 
  }
  saveStore(); render();
}

function updatePurchase(pid, field, val) {
  if (!isDateEditable(appState.purchaseDate)) return toast('不可修改');
  var p = getProd(pid); if (!p) return;
  if (!appState.records[appState.purchaseDate]) appState.records[appState.purchaseDate] = {};
  if (!appState.records[appState.purchaseDate][pid]) appState.records[appState.purchaseDate][pid] = { rem:'', waste:0, wasteReason:'' };
  var rec = appState.records[appState.purchaseDate][pid];
  if (!rec.purchase) rec.purchase = { inputQty:0, unit:'pack', qty:0, inputCost:0, unitCost:0, totalCost:0 };

  var numVal = Number(val);
  if (isNaN(numVal) || numVal < 0) numVal = 0;

  if (field === 'inputQty') {
    rec.purchase.inputQty = numVal;
    if (!rec.purchase.inputCost) {
       rec.purchase.inputCost = rec.purchase.unit === 'pack' ? (Number(p.packCost) || 0) : (getUnitCost(p) || 0);
    }
  }
  else if (field === 'inputCost') {
    rec.purchase.inputCost = numVal;
  }

  updatePurchaseCalc(pid);
  addLog('修改进货', p.name + ': 数量 ' + rec.purchase.qty);
  saveStore(); render();
}

function updatePurchaseCalc(pid) {
  var p = getProd(pid); if (!p) return;
  var rec = appState.records[appState.purchaseDate][pid];
  var packQty = Number(p.packQty) || 1;
  var inputQty = rec.purchase.inputQty;
  var inputCost = rec.purchase.inputCost;
  
  var qty = rec.purchase.unit === 'pack' ? inputQty * packQty : inputQty;
  var unitCost = 0;
  
  if (rec.purchase.unit === 'pack') {
    unitCost = packQty > 0 ? inputCost / packQty : 0;
  } else {
    unitCost = inputCost;
  }
  
  var total = qty * unitCost;
  
  rec.purchase.qty = qty;
  rec.purchase.unitCost = unitCost;
  rec.purchase.totalCost = Math.round(total * 100) / 100;
}

function updateRec(pid, field, val) {
  if (!isDateEditable(appState.date)) return toast('已锁定或历史日期不可修改');
  if (!appState.records[appState.date]) appState.records[appState.date] = {};
  if (!appState.records[appState.date][pid]) appState.records[appState.date][pid] = { rem:'', waste:0, wasteReason:'' };
  
  var rec = appState.records[appState.date][pid];
  var p = getProd(pid);
  var oldVal = rec[field] || '';
  
  if (field === 'rem') {
    if (val === '') rec.rem = '';
    else {
      var num = Number(val);
      rec.rem = isNaN(num) || num < 0 ? 0 : num;
    }
  }
  else if (field === 'waste') {
    if (val === '') rec.waste = 0;
    else {
      var num = Number(val);
      rec.waste = isNaN(num) || num < 0 ? 0 : num;
    }
    var cost = getUnitCost(p);
    rec.wasteCost = rec.waste * cost;
  }
  else {
    rec.wasteReason = val;
  }

  rec.priceSnapshot = p.price;
  rec.costSnapshot = getUnitCost(p);
  
  addLog('修改数据', p.name + ' 的 ' + (field==='rem'?'剩余数量':(field==='waste'?'损耗数量':'损耗原因')) + ' 从 ' + oldVal + ' 改为 ' + (rec[field] || 0));
  saveStore();
  render();
}

  if (appState.settings.categories.indexOf(clean) === -1) { appState.settings.categories.push(clean); saveStore(); }
  editingProdCat = clean;
  openProdEditor(pid || null);
}
function handlePhotoUpload(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 120, scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      editingProdImg = canvas.toDataURL('image/jpeg', 0.5);
      document.getElementById('imgPreviewBox').innerHTML = '<img src="' + editingProdImg + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function saveProdEditor(pid) {
  var name = document.getElementById('edName').value.trim();
  var price = parseFloat(document.getElementById('edPrice').value);
  var unitCost = parseFloat(document.getElementById('edUnitCost').value);
  var packQty = parseInt(document.getElementById('edPackQty').value) || 1;
  var packCost = parseFloat(document.getElementById('edPackCost').value);
  var initialStockStr = document.getElementById('edInitialStock').value;
  var spec = document.getElementById('edSpec').value.trim() || '1 stick';
  var unit = document.getElementById('edUnit').value.trim() || '支';
  var low = parseInt(document.getElementById('edLow').value) || 5;
  
  if (!name) return toast('产品名称不能为空');
  if (isNaN(price) || price < 0) price = 0;
  if (isNaN(unitCost) || unitCost < 0) unitCost = 0;
  if (isNaN(packCost) || packCost < 0) packCost = 0;
  if (packQty <= 0) packQty = 1;

  var initialStock = null;
  if (initialStockStr !== '') {
    initialStock = parseFloat(initialStockStr);
    if (isNaN(initialStock) || initialStock < 0) initialStock = 0;
  }

  if (!pid && initialStock === null) return toast('首次新增必须填写期初库存');
  
  var exist = appState.products.find(function(x) { return x.name === name && x.id !== pid; });
  if (exist) {
    if (!confirm('已存在同名产品，确定要保存吗？')) return;
  }

  if (unitCost === 0 && packCost > 0) unitCost = packCost / packQty;
  if (packCost === 0 && unitCost > 0) packCost = unitCost * packQty;
  
  if (pid) {
    for (var i = 0; i < appState.products.length; i++) {
      if (appState.products[i].id === pid) {
        appState.products[i].name = name;
        appState.products[i].price = price;
        appState.products[i].unitCost = unitCost;
        appState.products[i].packCost = packCost;
        appState.products[i].packQty = packQty;
        if (!appState.products[i].hasHistory) {
           appState.products[i].initialStock = initialStock;
        }
        appState.products[i].cat = editingProdCat;
        appState.products[i].spec = spec;
        appState.products[i].unit = unit;
        appState.products[i].low = low;
        appState.products[i].img = editingProdImg;
        break;
      }
    }
  } else {
    appState.products.push({
      id:'p_' + Date.now(), name:name, price:price, unitCost:unitCost, packCost:packCost, packQty:packQty, initialStock:initialStock, initDate:getLocalDate(0), cat:editingProdCat,
      spec:spec, unit:unit, low:low, img:editingProdImg, emoji:'🍢'
    });
  }
  addLog('修改产品', '保存了产品资料: ' + name);
  saveStore(); closeModal(); render(); toast('产品已保存');
}
function deleteProd(pid) {
  var p = getProd(pid);
  if (!confirm('确定删除此产品？')) return;
  appState.products = appState.products.filter(function(x) { return x.id !== pid; });
  addLog('删除产品', '删除了产品: ' + p.name);
  saveStore(); closeModal(); render(); toast('已删除');
}

function openProdHistory(pid) {
  var p = getProd(pid);
  if (!p) return;
  var dates = Object.keys(appState.records).filter(function(d){return d !== '__status';}).sort().reverse();
  var rowsHtml = '';
  dates.forEach(function(d) {
    var rec = appState.records[d][pid];
    if (!rec) return;
    var startData = getStartStock(p, d);
    var pc = rec.purchase || { qty: 0 };
    var pq = Number(pc.qty) || 0;
    var waste = Number(rec.waste) || 0;
    var rem = (rec.rem !== '' && rec.rem !== undefined) ? Number(rec.rem) : null;
    var sold = (rem !== null) ? (startData.val + pq - waste - rem) : '-';
    
    rowsHtml += '<div class="hist-row">' +
      '<div class="hist-date">' + formatCnDate(d) + '</div>' +
      '<div class="hist-detail">' +
        '期初:' + startData.val + ' | 进:' + pq + ' | 损:' + waste + ' | 剩:' + (rem!==null?rem:'-') + '<br>' +
        '<span style="color:var(--blue-light);font-weight:700;">推算卖: ' + sold + ' 支</span>' +
      '</div>' +
    '</div>';
  });
  if (!rowsHtml) rowsHtml = '<div class="info-cquote">暂无历史记录</div>';

  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
          '<div style="font-weight:800;font-size:17px;">📊 ' + esc(p.name) + ' 历史记录</div>' +
          '<button class="btn btn-dark btn-sm" onclick="openProdEditor(\'' + pid + '\')">返回编辑</button>' +
        '</div>' +
        '<div style="max-height:60vh;overflow-y:auto;">' + rowsHtml + '</div>' +
      '</div>' +
    '</div>';
}

/* ================= 弹窗与工具 ================= */
function openBatchAddModal() {
  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-weight:800;font-size:17px;">⚡ 批量粘贴自动添加</div>' +
          '<button class="btn btn-dark btn-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<div class="info-quote">【格式一】直接复制旧系统网页：把旧系统网页全选复制粘贴进来即可自动提取。<br><br>【格式二】每行一个产品：产品名, 售价, 分类</div>' +
        '<textarea id="batchInput" rows="12" style="font-size:12px;" placeholder="把旧系统网页全选复制粘贴到这里..."></textarea>' +
        '<button class="btn btn-blue btn-full" onclick="processBatchAdd()">智能解析并一键加入</button>' +
      '</div>' +
    '</div>';
}
function processBatchAdd() {
  var rawText = document.getElementById('batchInput').value;
  if (!rawText.trim()) return toast('请先粘贴产品内容');
  
  var lines = rawText.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  var added = 0;
  var currentCat = appState.settings.categories[0] || '其他类';
  
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    
    // 识别分类 (例如：▾蔬菜和菇14 / 19)
    if (line.indexOf('▾') > -1 || line.indexOf('▸') > -1) {
      var matchCat = line.match(/[▾▸](.+?)(\d+|$)/);
      if (matchCat && matchCat[1]) {
        var cName = matchCat[1].trim();
        if (cName.length > 0) {
          currentCat = cName;
          if (appState.settings.categories.indexOf(currentCat) === -1) {
            appState.settings.categories.push(currentCat);
          }
        }
      }
      continue;
    }
    
    // 识别带 RM 的行 (例如：RM 0.50 · 1 stick)
    if (line.indexOf('RM') > -1 && line.indexOf('·') > -1) {
      // 找到上一个有效行作为产品名
      if (i > 0) {
        var pName = lines[i-1];
        // 如果上一行包含“盘点”、“数量”、“元”等杂音，就跳过
        if (pName.indexOf('剩余数量') > -1 || pName.indexOf('损耗') > -1 || pName.indexOf('：') > -1) continue;
        
        var priceMatch = line.match(/RM\s*([\d\.]+)/);
        var specMatch = line.match(/·\s*(.+)/);
        
        if (priceMatch && pName) {
          var price = parseFloat(priceMatch[1]);
          var spec = specMatch ? specMatch[1].trim() : '1 stick';
          
          if (!appState.products.some(function(p) { return p.name === pName; })) {
            appState.products.push({
              id:'p_' + Date.now() + '_' + added, 
              name:pName, 
              price:price, 
              unitCost:0, packCost:0, 
              initialStock:null, initDate:getLocalDate(0), 
              cat:currentCat,
              spec:spec, unit:'支', packQty:1, 
              low:appState.settings.defaultLow, emoji:'🍢'
            });
            added++;
          }
        }
      }
      continue;
    }
    
    // 兼容传统格式：产品名, 售价, 分类
    if (line.indexOf(',') > -1 || line.indexOf('，') > -1) {
      var parts = line.split(/[,，\t]/).map(function(s) { return s.trim(); });
      var name = parts[0]; if (!name) continue;
      if (!appState.products.some(function(p) { return p.name === name; })) {
        var price = parseFloat(parts[1]) || 0.50;
        var cat = parts[2] || currentCat;
        if (appState.settings.categories.indexOf(cat) === -1) appState.settings.categories.push(cat);
        appState.products.push({
          id:'p_' + Date.now() + '_' + added, name:name, price:price, unitCost:0, packCost:0, initialStock:null, initDate:getLocalDate(0), cat:cat,
          spec:'1 stick', unit:'支', packQty:1, low:appState.settings.defaultLow, emoji:'🍢'
        });
        added++;
      }
    }
  }
  
  if (added === 0) return toast('没有解析到有效产品，请确认复制了正确的内容');
  
  addLog('批量新增', '智能解析并批量添加了 ' + added + ' 个产品');
  saveStore(); closeModal(); render(); toast('成功批量添加 ' + added + ' 个产品！');
}
function openWaModal() {
  var s = calcDayStats(appState.date);
  var lowList = [], wasteList = [], remLines = [], purLines = [];
  appState.products.forEach(function(p) {
    var r = appState.records[appState.date] && appState.records[appState.date][p.id];
    var pc = getPurchase(appState.date, p.id);
    if (pc && pc.qty) purLines.push('• ' + p.name + ': ' + pc.qty + p.unit + ' (RM ' + Number(pc.totalCost).toFixed(2) + ')');
    if (r && r.rem !== '' && r.rem !== undefined) {
      remLines.push('• ' + p.name + ': ' + r.rem + p.unit);
      if (Number(r.rem) <= p.low) lowList.push('• ' + p.name + ': 剩 ' + r.rem + p.unit + ' (警戒≤' + p.low + ')');
    }
    if (r && Number(r.waste) > 0) {
      var cost = r.wasteCost !== undefined ? r.wasteCost : (r.waste * getUnitCost(p));
      wasteList.push('• ' + p.name + ': ' + r.waste + p.unit + ' (成本 RM ' + cost.toFixed(2) + ') ' + (r.wasteReason ? '[' + r.wasteReason + ']' : ''));
    }
  });
  var text = '📋【' + appState.settings.shopName + '】盘点报告\n' +
    '📅 日期：' + appState.date + ' (' + formatCnDateWeek(appState.date) + ')\n' +
    '✅ 进度：已盘点 ' + s.filled + ' / ' + s.total + ' 项\n' +
    '━━━━━━━━━━━━━━━━━━\n' +
    '📦 今日进货：' + s.purchaseQty + ' 支 (RM ' + s.purchaseCost.toFixed(2) + ')\n' + (purLines.length ? purLines.join('\n') + '\n' : '') +
    '📉 推算销售：' + s.soldCount + ' 支 (约 RM ' + s.salesAmt.toFixed(2) + ')\n' +
    '🗑️ 今日损耗：' + s.wasteCount + ' 支 (成本 RM ' + s.wasteAmt.toFixed(2) + ')\n' +
    '📊 剩余总值：RM ' + s.invValue.toFixed(2) + '\n' +
    '━━━━━━━━━━━━━━━━━━\n' +
    '🚨 低库存提醒 (' + lowList.length + ')：\n' + (lowList.length ? lowList.join('\n') : '无') + '\n\n' +
    '⚠️ 损耗明细：\n' + (wasteList.length ? wasteList.join('\n') : '无') + '\n\n' +
    '📦 已盘点剩余明细：\n' + (remLines.length ? remLines.join('\n') : '暂未填写');
  document.getElementById('modalLayer').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-weight:800;font-size:17px;">WhatsApp 盘点报告预览</div>' +
          '<button class="btn btn-dark btn-sm" onclick="closeModal()">✕</button>' +
        '</div>' +
        '<textarea id="waFinalText" rows="16" style="font-family:monospace;font-size:12px;">' + esc(text) + '</textarea>' +
        '<div style="display:flex;gap:8px;">' +
          '<button class="btn btn-dark btn-full" onclick="copyReportText()">复制文字</button>' +
          '<button class="btn btn-blue btn-full" onclick="launchWhatsApp()">打开 WhatsApp</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}
function copyReportText() {
  var el = document.getElementById('waFinalText');
  el.select(); navigator.clipboard.writeText(el.value); toast('报告已复制到剪贴板');
}
function launchWhatsApp() {
  var msg = encodeURIComponent(document.getElementById('waFinalText').value);
  var phone = appState.settings.whatsapp;
  window.open(phone ? ('https://wa.me/' + phone + '?text=' + msg) : ('https://wa.me/?text=' + msg), '_blank');
}
function closeModal() { document.getElementById('modalLayer').innerHTML = ''; }

function loadPresetList() {
  var added = 0;
  PRESET_PRODUCTS.forEach(function(item) {
    if (!appState.products.some(function(p) { return p.name === item.name; })) {
      appState.products.push(item); added++;
    }
  });
  addLog('系统初始化', '载入了 ' + added + ' 项预设产品');
  saveStore(); render(); toast(added ? ('已载入 ' + added + ' 项产品') : '已存在');
}

// ================= 【核心修复 3】一键迁移本地旧数据 =================
function migrateOldData() {
  if (!confirm('系统将尝试从本机浏览器缓存中寻找旧版数据，找到后会自动合并，是否继续？')) return;
  
  var keys = ['dc_v8_products', 'dc_v7_products', 'dc_v6_products', 'dc_v5_products', 'dc_v4_products', 'dc_v3_products', 'dc_v2_products', 'dc_v2_settings'];
  var foundProducts = null;
  var foundRecords = null;
  
  keys.forEach(function(k) {
    var d = localStorage.getItem(k);
    if (d) {
      try {
        var parsed = JSON.parse(d);
        if (Array.isArray(parsed) && parsed.length > 0) {
          if (!foundProducts || parsed.length > foundProducts.length) foundProducts = parsed;
        }
      } catch(e) {}
    }
  });

  ['dc_v8_records', 'dc_v7_records', 'dc_v6_records', 'dc_v5_records', 'dc_v4_records', 'dc_v3_records', 'dc_v2_records'].forEach(function(k) {
    var d = localStorage.getItem(k);
    if (d && !foundRecords) {
      try {
        var parsed = JSON.parse(d);
        if (typeof parsed === 'object') foundRecords = parsed;
      } catch(e) {}
    }
  });

  if (!foundProducts) {
    return toast('未在本地找到旧版产品数据，推荐使用【批量粘贴】功能。');
  }

  if (!confirm('找到旧版数据！共计 ' + foundProducts.length + ' 个产品。\n是否立即合并到新系统？（不会覆盖你当前已有的产品）')) return;

  var added = 0;
  foundProducts.forEach(function(oldP) {
    if (!appState.products.some(function(p) { return p.name === oldP.name; })) {
      var newP = Object.assign({}, oldP);
      if (newP.packQty === undefined) newP.packQty = 1;
      if (newP.packCost === undefined) newP.packCost = 0;
      if (newP.unitCost === undefined) newP.unitCost = newP.packCost / newP.packQty;
      if (newP.initialStock === undefined) newP.initialStock = null;
      if (newP.initDate === undefined) newP.initDate = getLocalDate(0);
      appState.products.push(newP);
      added++;
    }
  });

  if (foundRecords) {
    for (var d in foundRecords) {
      if (d === '__status') continue;
      if (!appState.records[d]) appState.records[d] = foundRecords[d];
    }
  }

  addLog('系统迁移', '一键迁移了本地旧版数据，新增 ' + added + ' 个产品');
  saveStore();
  render();
  toast('旧版数据迁移成功！新增 ' + added + ' 个产品');
}

// ================= 导出与导入 =================
function exportExcelCsv() {
  if (!appState.products.length) return toast('暂无产品资料');
  
  var header = ['日期','分类','产品名称','规格','售价(RM)','单支成本(RM)','每包数量','每包成本(RM)','期初库存','进货包数','进货支数','进货成本(RM)','上次剩余','今日剩余','损耗个数','损耗金额(RM)','损耗原因','推算销售'];
  var lines = [header.map(escapeCSV).join(',')];

  appState.products.forEach(function(p) {
    var r = (appState.records[appState.date] && appState.records[appState.date][p.id]) || {};
    var pc = getPurchase(appState.date, p.id) || { inputQty:'', qty:'', totalCost:'' };
    var startData = getStartStock(p, appState.date);
    var rem = (r.rem !== '' && r.rem !== undefined) ? r.rem : '';
    var waste = r.waste || 0;
    var cost = r.wasteCost || (waste * getUnitCost(p));
    var sold = (rem !== '') ? (startData.val + (pc.qty || 0) - waste - Number(rem)) : '';
    
    var row = [
      appState.date, p.cat, p.name, p.spec, p.price, getUnitCost(p).toFixed(2),
      (p.packQty||1), (p.packCost||0), startData.val, (pc.inputQty||''), (pc.qty||''), (pc.totalCost||''),
      startData.val, rem, waste, cost.toFixed(2), (r.wasteReason || ''), sold
    ];
    lines.push(row.map(escapeCSV).join(','));
  });

  var blob = new Blob(['\uFEFF' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = appState.settings.shopName + '报表' + appState.date + '.csv';
  a.click();
  addLog('汇出数据', '汇出了 ' + appState.date + ' 的 Excel 报表');
  toast('报表已导出');
}

function exportJsonBackup() {
  var data = { products:appState.products, records:appState.records, settings:appState.settings, logs: appState.logs };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });

// 修复调起相机的致命问题
function triggerImportJson() {
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.json,application/json';
  fileInput.style.display = 'none';
  fileInput.onchange = function(e) {
    importJsonBackup(e);
  };
  document.body.appendChild(fileInput);
  fileInput.click();
  setTimeout(function() { document.body.removeChild(fileInput); }, 1000);
}

function importJsonBackup(e) {
  var f = e.target.files[0]; if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var d = JSON.parse(ev.target.result);
      
      if (!d.products || !Array.isArray(d.products)) throw new Error('产品数据结构损坏');
      if (!d.records || typeof d.records !== 'object') throw new Error('盘点记录结构损坏');
      
      if (confirm('导入前，系统将自动为您导出当前数据的备份，是否继续？')) {
        exportJsonBackup();
      } else {
        return;
      }

      appState.products = d.products.map(function(p) {
        var newP = Object.assign({}, p);
        if (newP.packQty === undefined || isNaN(newP.packQty)) newP.packQty = 1;
        if (newP.packCost === undefined || isNaN(newP.packCost)) newP.packCost = 0;
        if (newP.unitCost === undefined || isNaN(newP.unitCost)) {
          newP.unitCost = newP.packQty > 0 ? newP.packCost / newP.packQty : 0;
        }
        if (newP.initialStock === undefined) newP.initialStock = null;
        if (newP.initDate === undefined) newP.initDate = getLocalDate(0);
        return newP;
      });
      
      appState.records = d.records;
      
      if (d.settings) appState.settings = Object.assign(appState.settings, d.settings);
      if (!appState.settings.categories) appState.settings.categories = DEFAULT_CATEGORIES.slice();
      if (d.logs) appState.logs = d.logs;
      
      addLog('还原数据', '成功恢复了系统备份。');
      saveStore(); render(); 
      toast('备份还原成功！请去【产品】里补全期初库存');
      
    } catch (err) { 
      console.error(err);
      toast('导入失败：' + err.message); 
    }
  };
  reader.readAsText(f);
}

function clearEverything() {
  if (!confirm('⚠️ 确定要清空全部资料吗？此操作不可逆！')) return;
  if (!confirm('请再次确认：真的要删除所有产品、历史记录和设置吗？')) return;
  appState.products = []; appState.records = []; appState.logs = [];
  saveStore(); render(); toast('已清空全部资料');
}

render();
